<!DOCTYPE html>
<html lang="es" translate="no">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="google" content="notranslate">
<title>PDMM+ Mods</title>
<style>
  :root { --bg:#0e1116; --card:#171b22; --line:#262c36; --fg:#e8ecf1; --mut:#8b95a5;
          --acc:#39c5bb; --acc2:#ff5fa2; }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f5f7fa; --card:#ffffff; --line:#e2e6ec; --fg:#16191f; --mut:#667085; }
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:system-ui,-apple-system,"Segoe UI",sans-serif;
         background:var(--bg); color:var(--fg); line-height:1.45; }
  header { position:sticky; top:0; z-index:20; display:flex; align-items:center; gap:8px;
           padding:10px 16px; background:color-mix(in srgb, var(--bg) 85%, transparent);
           backdrop-filter:blur(10px); border-bottom:1px solid var(--line); }
  .logo { font-weight:800; font-size:20px; letter-spacing:.3px; margin-right:auto;
          background:linear-gradient(90deg,var(--acc),var(--acc2)); -webkit-background-clip:text;
          background-clip:text; color:transparent; }
  .btn { border:1px solid var(--line); background:var(--card); color:var(--fg); padding:9px 14px;
         border-radius:10px; font-size:15px; font-weight:600; cursor:pointer; }
  .btn.pri { border:none; color:#06201e; background:linear-gradient(90deg,var(--acc),#6fe0d6); }
  .btn:disabled { opacity:.6; }
  .hide { display:none !important; }
  main { max-width:880px; margin:0 auto; padding:18px 16px 60px; }
  .hero h1 { margin:6px 0 4px; font-size:26px; }
  .hero p { margin:0 0 16px; color:var(--mut); }
  .bar { display:flex; gap:10px; align-items:center; margin-bottom:14px; }
  .bar input { flex:1; }
  .count { color:var(--mut); font-size:14px; white-space:nowrap; }
  input, textarea { width:100%; padding:11px 12px; border-radius:10px; border:1px solid var(--line);
         background:var(--bg); color:var(--fg); font-size:16px; font-family:inherit; }
  input:focus, textarea:focus { outline:2px solid var(--acc); outline-offset:0; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(250px,1fr)); gap:12px; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px;
          display:flex; flex-direction:column; gap:8px; }
  .top { display:flex; gap:10px; align-items:center; }
  .av { width:42px; height:42px; border-radius:12px; display:grid; place-items:center; font-weight:800;
        font-size:18px; color:#06201e; background:linear-gradient(135deg,var(--acc),var(--acc2)); flex:none; }
  .card h3 { margin:0; font-size:17px; word-break:break-word; }
  .meta { color:var(--mut); font-size:13px; }
  .card p { margin:0; font-size:14px; color:var(--fg); opacity:.9; word-break:break-word; }
  .card a.dl { margin-top:auto; text-align:center; text-decoration:none; }
  .empty { grid-column:1/-1; text-align:center; color:var(--mut); padding:36px 8px; }
  dialog { width:min(92vw,420px); border:1px solid var(--line); border-radius:16px; padding:18px;
           background:var(--card); color:var(--fg); }
  dialog::backdrop { background:rgba(0,0,0,.6); }
  dialog h2 { margin:0 0 10px; }
  dialog .row { display:flex; flex-direction:column; gap:8px; }
  dialog .acts { display:flex; gap:8px; margin-top:12px; }
  dialog .acts .btn { flex:1; }
  .filebtn { display:block; padding:12px; text-align:center; border:2px dashed var(--line);
             border-radius:10px; color:var(--mut); cursor:pointer; word-break:break-all; }
  .filebtn input { display:none; }
  .hint { color:var(--mut); font-size:13px; margin:6px 0 0; }
  #toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:50;
           max-width:90vw; padding:12px 16px; border-radius:12px; font-weight:600; display:none;
           background:var(--acc2); color:#fff; box-shadow:0 6px 24px rgba(0,0,0,.35); }
</style>
</head>
<body>
<header>
  <div class="logo">PDMM+ Mods</div>
  <span id="who" class="meta hide"></span>
  <button id="btnOpenUpload" class="btn pri hide">Subir mod</button>
  <button id="btnOpenAuth" class="btn">Entrar</button>
  <button id="btnLogout" class="btn hide">Salir</button>
</header>

<main>
  <div class="hero">
    <h1>Mods de Project Diva</h1>
    <p>Descubre y comparte mods hechos por la comunidad.</p>
  </div>
  <div class="bar">
    <input id="q" type="search" placeholder="Buscar por título, autor o descripción">
    <span id="count" class="count"></span>
  </div>
  <div id="list" class="grid"><div class="empty">Cargando...</div></div>
</main>

<dialog id="authDlg">
  <h2>Cuenta</h2>
  <div class="row">
    <input id="email" type="email" placeholder="Correo electrónico" autocomplete="email">
    <input id="password" type="password" placeholder="Contraseña (mín. 6 caracteres)" autocomplete="current-password">
  </div>
  <div class="acts">
    <button id="btnLogin" class="btn pri">Iniciar sesión</button>
    <button id="btnSignup" class="btn">Crear cuenta</button>
  </div>
  <div class="acts"><button class="btn" data-close>Cerrar</button></div>
</dialog>

<dialog id="upDlg">
  <h2>Subir un mod</h2>
  <div class="row">
    <input id="title" placeholder="Título del mod">
    <input id="author" placeholder="Autor / creador">
    <textarea id="desc" rows="3" placeholder="Descripción"></textarea>
    <label class="filebtn"><span id="fileName">Toca para elegir archivo (.zip, .7z, .rar)</span>
      <input id="file" type="file" accept=".zip,.7z,.rar"></label>
  </div>
  <p class="hint">Máximo 50 MB. Tu mod se publicará cuando sea aprobado.</p>
  <div class="acts">
    <button id="btnUpload" class="btn pri">Subir mod</button>
    <button class="btn" data-close>Cancelar</button>
  </div>
</dialog>

<div id="toast"></div>

<script>
const URL_BASE = "https://nidlcakntjjzgkjlejbk.supabase.co";
const KEY = "sb_publishable_TVKTwGkcuLX_eXNon8IQjg_Jor-NquZ";
const MAX_BYTES = 50 * 1024 * 1024;
const $ = (id) => document.getElementById(id);

let session = null;
let allMods = [];
try { session = JSON.parse(localStorage.getItem("pdmm_session") || "null"); } catch (e) {}

function toast(text) {
  const t = $("toast");
  t.textContent = text;
  t.style.display = "block";
  clearTimeout(toast.t);
  toast.t = setTimeout(() => (t.style.display = "none"), 6000);
}

window.addEventListener("error", (e) => toast("Error en la página: " + e.message));
window.addEventListener("unhandledrejection", (e) => toast("Error: " + ((e.reason && e.reason.message) || e.reason)));

function esc(s) {
  const d = document.createElement("div");
  d.textContent = s == null ? "" : s;
  return d.innerHTML;
}

function headers(extra) {
  const token = session && session.access_token ? session.access_token : KEY;
  return Object.assign({ apikey: KEY, Authorization: "Bearer " + token }, extra || {});
}

function saveSession(s) {
  session = s;
  if (s) localStorage.setItem("pdmm_session", JSON.stringify(s));
  else localStorage.removeItem("pdmm_session");
  renderAuth();
}

function renderAuth() {
  const logged = !!(session && session.access_token);
  $("btnOpenAuth").classList.toggle("hide", logged);
  $("btnOpenUpload").classList.toggle("hide", !logged);
  $("btnLogout").classList.toggle("hide", !logged);
  $("who").classList.toggle("hide", !logged);
  if (logged) $("who").textContent = (session.user && session.user.email) || "";
}

async function authCall(path, body) {
  const r = await fetch(URL_BASE + "/auth/v1/" + path, {
    method: "POST",
    headers: { apikey: KEY, "Content-Type": "application/json" },
    body: JSON.stringify(body),
  });
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.msg || data.error_description || data.message || ("Error " + r.status));
  return data;
}

async function refreshIfNeeded() {
  if (!session || !session.refresh_token) return;
  const now = Math.floor(Date.now() / 1000);
  if (session.expires_at && session.expires_at - now > 60) return;
  try {
    const d = await authCall("token?grant_type=refresh_token", { refresh_token: session.refresh_token });
    saveSession(d);
  } catch (e) { saveSession(null); }
}

function renderMods() {
  const q = $("q").value.trim().toLowerCase();
  const items = allMods.filter((m) =>
    ((m.title || "") + " " + (m.author || "") + " " + (m.description || "")).toLowerCase().includes(q));
  $("count").textContent = allMods.length + (allMods.length === 1 ? " mod" : " mods");
  const list = $("list");
  if (!items.length) {
    list.innerHTML = "<div class='empty'>" + (allMods.length ? "No hay resultados para tu búsqueda." : "Todavía no hay mods publicados.") + "</div>";
    return;
  }
  list.innerHTML = items.map((m) => `
    <div class="card">
      <div class="top">
        <div class="av">${esc((m.title || "?").trim().charAt(0).toUpperCase())}</div>
        <div>
          <h3>${esc(m.title)}</h3>
          <div class="meta">por ${esc(m.author)} · ${new Date(m.created_at).toLocaleDateString("es")}</div>
        </div>
      </div>
      ${m.description ? "<p>" + esc(m.description) + "</p>" : ""}
      <a class="btn pri dl" href="${esc(m.file_url)}" target="_blank" rel="noopener">Descargar</a>
    </div>`).join("");
}

async function loadMods() {
  try {
    const r = await fetch(URL_BASE + "/rest/v1/mods?select=*&approved=eq.true&order=created_at.desc", { headers: headers() });
    const data = await r.json();
    if (!r.ok) throw new Error(data.message || ("Error " + r.status));
    allMods = data;
    renderMods();
  } catch (e) {
    $("list").innerHTML = "<div class='empty'>No se pudieron cargar los mods: " + esc(e.message) + "</div>";
  }
}

document.querySelectorAll("[data-close]").forEach((b) => (b.onclick = () => b.closest("dialog").close()));
$("btnOpenAuth").onclick = () => $("authDlg").showModal();
$("btnOpenUpload").onclick = () => $("upDlg").showModal();
$("q").oninput = renderMods;
$("file").onchange = () => {
  const f = $("file").files[0];
  $("fileName").textContent = f ? f.name : "Toca para elegir archivo (.zip, .7z, .rar)";
};

$("btnSignup").onclick = async () => {
  const email = $("email").value.trim(), password = $("password").value;
  if (!email || password.length < 6) return toast("Escribe un correo válido y una contraseña de 6 o más caracteres.");
  try {
    const d = await authCall("signup", { email, password });
    $("authDlg").close();
    if (d.access_token) { saveSession(d); toast("Cuenta creada. Ya iniciaste sesión."); }
    else toast("Cuenta creada. Revisa tu correo (y spam) para confirmarla y luego inicia sesión.");
  } catch (e) { toast("Error: " + e.message); }
};

$("btnLogin").onclick = async () => {
  const email = $("email").value.trim(), password = $("password").value;
  if (!email || !password) return toast("Escribe tu correo y contraseña.");
  try {
    const d = await authCall("token?grant_type=password", { email, password });
    saveSession(d);
    $("authDlg").close();
    toast("Sesión iniciada.");
  } catch (e) { toast("Error: " + e.message); }
};

$("btnLogout").onclick = () => { saveSession(null); toast("Sesión cerrada."); };

$("btnUpload").onclick = async () => {
  const title = $("title").value.trim();
  const author = $("author").value.trim();
  const description = $("desc").value.trim();
  const file = $("file").files[0];
  if (!title || !author || !file) return toast("Completa título, autor y archivo.");
  if (file.size > MAX_BYTES) return toast("El archivo supera los 50 MB.");
  if (!/\.(zip|7z|rar)$/i.test(file.name)) return toast("Solo se permiten .zip, .7z o .rar.");
  await refreshIfNeeded();
  if (!session) return toast("Inicia sesión primero.");

  const btn = $("btnUpload");
  btn.disabled = true; btn.textContent = "Subiendo...";
  try {
    const safeName = file.name.replace(/[^a-zA-Z0-9._-]/g, "_");
    const path = session.user.id + "/" + Date.now() + "_" + safeName;

    const up = await fetch(URL_BASE + "/storage/v1/object/mods/" + path, {
      method: "POST",
      headers: headers({ "Content-Type": file.type || "application/octet-stream" }),
      body: file,
    });
    if (!up.ok) {
      const e = await up.json().catch(() => ({}));
      throw new Error(e.message || e.error || ("Error al subir el archivo (" + up.status + ")"));
    }

    const fileUrl = URL_BASE + "/storage/v1/object/public/mods/" + path;
    const ins = await fetch(URL_BASE + "/rest/v1/mods", {
      method: "POST",
      headers: headers({ "Content-Type": "application/json", Prefer: "return=minimal" }),
      body: JSON.stringify({ title, author, description, file_url: fileUrl }),
    });
    if (!ins.ok) {
      const e = await ins.json().catch(() => ({}));
      throw new Error(e.message || ("Error al guardar (" + ins.status + ")"));
    }

    $("upDlg").close();
    toast("¡Mod enviado! Se publicará cuando sea aprobado.");
    $("title").value = ""; $("author").value = ""; $("desc").value = ""; $("file").value = "";
    $("fileName").textContent = "Toca para elegir archivo (.zip, .7z, .rar)";
  } catch (e) {
    toast("Error: " + e.message);
  } finally {
    btn.disabled = false; btn.textContent = "Subir mod";
  }
};

renderAuth();
refreshIfNeeded().then(renderAuth);
loadMods();
</script>
</body>
</html>
