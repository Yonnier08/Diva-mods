<!DOCTYPE html>
<html lang="es" translate="no" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="google" content="notranslate">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDMM+ Mods</title>
<link rel="icon" href="logo.png">
<style>
  :root {
    --bg:#0f1318; --surface:#161b22; --line:#262d37; --fg:#e4e7eb; --mut:#8b94a1;
    --acc:#3cc4b8; --acc-fg:#06201d; --pink:#e0629a; --danger:#ee6b6e; --title:var(--fg);
  }
  html[data-theme="light"] {
    --bg:#f2f4f7; --surface:#ffffff; --line:#dde2e8; --fg:#1c2127; --mut:#667085;
    --acc:#0e9a8f; --acc-fg:#ffffff; --pink:#c43c7a; --danger:#d03a3a;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Inter","Segoe UI",Roboto,system-ui,sans-serif; background:var(--bg); color:var(--fg); font-size:15px; line-height:1.5; }
  .ic { width:15px; height:15px; vertical-align:-2px; flex:none; }

  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-track { background:var(--bg); }
  ::-webkit-scrollbar-thumb { background:var(--line); border-radius:4px; }
  * { scrollbar-width:thin; scrollbar-color:var(--line) var(--bg); }

  header { position:sticky; top:0; z-index:20; background:var(--surface); border-bottom:1px solid var(--line); }
  .top { display:flex; align-items:center; gap:10px; padding:8px 14px; max-width:1200px; margin:0 auto; }
  .brand { display:flex; align-items:center; text-decoration:none; }
  .brand img { height:34px; width:auto; object-fit:contain; display:block; }
  .nav-toggle { background:none; border:none; color:var(--fg); cursor:pointer; padding:6px; display:flex; align-items:center; border-radius:4px; }
  .nav-toggle:hover { background:var(--bg); }
  .header-acts { display:flex; align-items:center; gap:6px; margin-left:auto; }

  .sidebar-overlay { position:fixed; inset:0; background:rgba(0,0,0,.55); z-index:40; opacity:0; pointer-events:none; transition:opacity .15s; }
  .sidebar-overlay.open { opacity:1; pointer-events:auto; }
  .sidebar { position:fixed; top:0; left:0; bottom:0; width:260px; background:var(--surface); border-right:1px solid var(--line); z-index:50; transform:translateX(-100%); transition:transform .18s; display:flex; flex-direction:column; padding:16px; }
  .sidebar.open { transform:none; }
  .sidebar-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:16px; }
  .sidebar-header h2 { margin:0; font-size:16px; font-weight:600; }
  .sidebar-links { display:flex; flex-direction:column; }
  .sidebar-links button { background:none; border:none; border-left:3px solid transparent; text-align:left; color:var(--mut); font-size:15px; padding:10px 12px; cursor:pointer; font-family:inherit; }
  .sidebar-links button:hover { color:var(--fg); }
  .sidebar-links button.on { color:var(--fg); border-left-color:var(--acc); background:var(--bg); }

  .search-container { max-width:1200px; margin:0 auto; padding:0 14px; overflow:hidden; max-height:0; transition:max-height .2s, padding .2s; }
  .search-container.open { max-height:70px; padding:10px 14px 4px; }

  .btn { border:1px solid var(--line); background:var(--surface); color:var(--fg); padding:7px 13px; border-radius:5px; font-size:14px; font-weight:500; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:6px; font-family:inherit; }
  .btn:hover { border-color:var(--mut); }
  .btn.pri { background:var(--acc); border-color:var(--acc); color:var(--acc-fg); font-weight:600; }
  .btn.pri:hover { filter:brightness(1.08); }
  .btn.danger { color:var(--danger); }
  .btn.danger:hover { border-color:var(--danger); }
  .btn.sm { padding:4px 9px; font-size:13px; }
  .btn:disabled { opacity:.55; cursor:default; }
  .hide { display:none !important; }

  .av { border-radius:50%; object-fit:cover; display:grid; place-items:center; font-weight:700; color:var(--acc-fg); background:var(--acc); flex:none; overflow:hidden; }

  main { max-width:1200px; margin:0 auto; padding:18px 14px 50px; }
  input, textarea, select { width:100%; padding:9px 11px; border-radius:5px; border:1px solid var(--line); background:var(--bg); color:var(--fg); font-size:15px; font-family:inherit; }
  input:focus, textarea:focus, select:focus { outline:2px solid var(--acc); outline-offset:-1px; }

  .control-bar { display:flex; flex-direction:column; gap:8px; margin-bottom:14px; padding-bottom:10px; border-bottom:1px solid var(--line); }
  .control-group { display:grid; grid-template-columns:1fr 1fr; gap:8px; }
  .select-wrapper { min-width:0; }
  .select-wrapper select { width:100%; padding:8px; font-size:13.5px; cursor:pointer; text-overflow:ellipsis; }
  .count { color:var(--mut); font-size:13px; }
  @media (min-width: 680px) {
    .control-bar { flex-direction:row; align-items:center; justify-content:space-between; }
    .control-group { display:flex; }
    .select-wrapper select { width:auto; padding:7px 10px; font-size:14px; }
    .count { margin-left:auto; }
  }

  .gb-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:10px; }
  @media (min-width: 680px) { .gb-grid { grid-template-columns:repeat(3, 1fr); gap:14px; } }
  @media (min-width: 1024px) { .gb-grid { grid-template-columns:repeat(4, 1fr); } }

  .gb-card { background:var(--surface); border:1px solid var(--line); border-radius:6px; overflow:hidden; cursor:pointer; display:flex; flex-direction:column; }
  .gb-card:hover { border-color:var(--mut); }
  .gb-thumb { position:relative; width:100%; aspect-ratio:16/10; background:var(--bg); overflow:hidden; display:grid; place-items:center; }
  .gb-thumb img.cover { width:100%; height:100%; object-fit:cover; display:block; }
  .gb-thumb img.ph { width:42%; opacity:.28; }
  .badge-cat { position:absolute; left:6px; bottom:6px; background:rgba(0,0,0,.72); color:#fff; font-size:11px; padding:1px 6px; border-radius:3px; }

  .gb-info { padding:9px 10px 10px; display:flex; flex-direction:column; gap:4px; flex:1; }
  .gb-title { margin:0; font-size:14.5px; font-weight:600; color:var(--title); line-height:1.3; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; word-break:break-word; }
  .gb-card:hover .gb-title { color:var(--acc); }
  .gb-author { display:flex; align-items:center; gap:6px; color:var(--mut); font-size:12.5px; min-width:0; width:fit-content; max-width:100%; }
  .gb-author span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .gb-author:hover span { color:var(--fg); text-decoration:underline; }
  .gb-stats { display:flex; align-items:center; gap:10px; color:var(--mut); font-size:12px; margin-top:auto; padding-top:2px; flex-wrap:wrap; }
  .gb-stats span { display:inline-flex; align-items:center; gap:3px; }
  .gb-stats .date { margin-left:auto; }

  .empty { grid-column:1/-1; text-align:center; color:var(--mut); padding:44px 8px; }

  .mod-page { background:var(--surface); border:1px solid var(--line); border-radius:6px; padding:18px; margin-top:8px; }
  .mod-header-row { display:flex; align-items:flex-start; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:14px; }
  .mod-title { margin:0 0 6px; font-size:23px; font-weight:600; line-height:1.25; }
  .like-btn { background:none; border:1px solid var(--line); color:var(--fg); padding:6px 12px; border-radius:5px; font-size:14px; cursor:pointer; display:inline-flex; align-items:center; gap:7px; font-family:inherit; }
  .like-btn:hover { border-color:var(--pink); color:var(--pink); }
  .like-btn.liked { border-color:var(--pink); color:var(--pink); }

  .comments-sec { margin-top:26px; border-top:1px solid var(--line); padding-top:16px; }
  .sec-title { font-size:16px; font-weight:600; margin:0 0 12px; }
  .comment-box { display:flex; gap:8px; margin-bottom:12px; }
  .comment-box input { flex:1; }
  .cm { padding:11px 0; border-top:1px solid var(--line); }
  #commentsList > .cm:first-child { border-top:none; }
  .cm-head { display:flex; align-items:center; gap:8px; margin-bottom:3px; }
  .cm-who { display:inline-flex; align-items:center; gap:8px; cursor:pointer; }
  .cm-who:hover .cm-user { text-decoration:underline; }
  .cm-user { font-weight:600; font-size:13.5px; }
  .cm-time { color:var(--mut); font-size:12px; margin-left:auto; }
  .cm-text { font-size:14.5px; white-space:pre-wrap; word-break:break-word; }
  .cm-acts { display:flex; gap:14px; margin-top:4px; }
  .linkbtn { background:none; border:none; padding:0; color:var(--mut); font-size:12.5px; cursor:pointer; font-family:inherit; }
  .linkbtn:hover { color:var(--acc); }
  .linkbtn.danger:hover { color:var(--danger); }
  .tag { font-size:11px; color:var(--acc); border:1px solid var(--acc); border-radius:3px; padding:0 5px; }
  .replies { margin:0 0 6px 11px; padding-left:14px; border-left:2px solid var(--line); }
  .replies .cm { border-top:none; padding:8px 0 4px; }
  .cm-form { display:flex; gap:6px; margin-top:8px; }
  .cm-form input { flex:1; }

  dialog { width:min(92vw, 600px); max-height:85vh; border:1px solid var(--line); border-radius:6px; padding:18px; background:var(--surface); color:var(--fg); overflow:hidden; }
  dialog[open] { display:flex; flex-direction:column; }
  dialog::backdrop { background:rgba(0,0,0,.65); }
  dialog h2 { margin:0 0 12px; font-size:19px; font-weight:600; flex-shrink:0; }

  .row, #pgView, #pgEdit, #userBody, #mineList { overflow-y:auto; flex:1; max-height:55vh; padding-right:4px; margin-bottom:8px; }
  .row { display:flex; flex-direction:column; gap:10px; }
  .acts { display:flex; gap:8px; margin-top:12px; flex-shrink:0; flex-wrap:wrap; }
  .acts .btn { flex:1; }

  .filebtn { display:block; padding:13px; text-align:center; border:1px dashed var(--mut); border-radius:5px; color:var(--mut); cursor:pointer; font-size:14px; }
  .filebtn:hover { border-color:var(--acc); color:var(--fg); }
  .filebtn input { display:none; }
  .hint { color:var(--mut); font-size:13px; margin:2px 0; }
  .thumbs { display:flex; gap:8px; flex-wrap:wrap; }
  .thumbs img { width:70px; height:70px; object-fit:cover; border-radius:4px; border:1px solid var(--line); }
  .thumb { position:relative; }
  .thumb button { position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%; border:none; background:var(--danger); color:#fff; font-size:11px; cursor:pointer; padding:0; }

  .gallery { display:flex; gap:8px; overflow-x:auto; scroll-snap-type:x mandatory; margin-bottom:14px; border-radius:5px; background:var(--bg); border:1px solid var(--line); padding:6px; width:100%; }
  .gallery img { width:100%; max-height:420px; aspect-ratio:16/9; border-radius:4px; scroll-snap-align:start; flex:none; object-fit:contain; }

  .desc { white-space:pre-wrap; word-break:break-word; margin:12px 0 18px; line-height:1.6; }
  .mine { border:1px solid var(--line); border-radius:5px; padding:11px; margin-bottom:10px; }
  .mine h3 { margin:2px 0 6px; font-size:15.5px; font-weight:600; word-break:break-word; }
  .chip { display:inline-block; font-size:11.5px; padding:1px 7px; border-radius:3px; border:1px solid var(--line); color:var(--mut); }
  .chip.ok { color:var(--acc); border-color:var(--acc); }
  .chip.off { color:var(--mut); }
  .uhead { display:flex; align-items:center; gap:14px; margin-bottom:10px; }
  .rich p { margin:0 0 10px; }
  .rich ul { margin:0 0 10px; padding-left:20px; }
  #toast { position:fixed; left:50%; bottom:22px; transform:translateX(-50%); z-index:50; max-width:90vw; padding:11px 16px; border-radius:5px; font-size:14px; display:none; background:var(--fg); color:var(--bg); }

  .fld { display:flex; flex-direction:column; gap:6px; }
  .fld-l { font-size:13px; font-weight:600; display:flex; justify-content:space-between; align-items:center; }
  .fld-l .muted { color:var(--mut); font-weight:400; }
  .up-body { max-height:60vh; gap:16px; }
  #desc { min-height:160px; resize:vertical; line-height:1.55; }
  #eDesc { min-height:160px; resize:vertical; line-height:1.55; }
  .counter { align-self:flex-end; font-size:12px; color:var(--mut); }
  .imggrid { display:grid; grid-template-columns:repeat(auto-fill, minmax(84px, 1fr)); gap:8px; }
  .ithumb { position:relative; aspect-ratio:1; border-radius:5px; overflow:hidden; border:1px solid var(--line); cursor:pointer; background:var(--bg); }
  .ithumb.cover { border-color:var(--acc); }
  .ithumb img { width:100%; height:100%; object-fit:cover; display:block; }
  .cover-tag { position:absolute; left:0; right:0; bottom:0; background:rgba(0,0,0,.72); color:#fff; font-size:11px; text-align:center; padding:2px 0; }
  .ithumb .rm { position:absolute; top:3px; right:3px; width:22px; height:22px; border-radius:50%; border:none; background:rgba(0,0,0,.72); color:#fff; font-size:11px; cursor:pointer; padding:0; }
  .iadd { aspect-ratio:1; border:1px dashed var(--mut); border-radius:5px; background:none; color:var(--mut); cursor:pointer; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:4px; font-size:12px; font-family:inherit; padding:4px; }
  .iadd:hover { border-color:var(--acc); color:var(--fg); }
  .iadd svg { width:22px; height:22px; }
  .filepick { display:flex; align-items:center; gap:12px; width:100%; padding:14px; border:1px dashed var(--mut); border-radius:5px; background:none; color:var(--fg); cursor:pointer; text-align:left; font-family:inherit; font-size:14.5px; }
  .filepick:hover { border-color:var(--acc); }
  .filepick svg { width:26px; height:26px; color:var(--mut); flex:none; }
  .filepick span { display:flex; flex-direction:column; gap:2px; }
  .filepick small { color:var(--mut); font-size:12.5px; }
  .filecard { display:flex; align-items:center; gap:12px; padding:12px; border:1px solid var(--acc); border-radius:5px; }
  .filecard.bad { border-color:var(--danger); }
  .filecard svg { width:24px; height:24px; color:var(--acc); flex:none; }
  .filecard.bad svg { color:var(--danger); }
  .fc-t { min-width:0; flex:1; display:flex; flex-direction:column; }
  .fc-t b { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-weight:600; font-size:14px; }
  .fc-t small { color:var(--mut); font-size:12.5px; }
  .filecard.bad .fc-t small { color:var(--danger); }
  .up-progress { margin-top:10px; flex-shrink:0; }
  .bar { height:8px; background:var(--bg); border:1px solid var(--line); border-radius:4px; overflow:hidden; }
  #upBar { height:100%; width:0; background:var(--acc); transition:width .15s; }
  #upStatus { display:block; margin-top:5px; font-size:13px; color:var(--mut); }
  .center { text-align:center; }

  .rte-bar { display:flex; flex-wrap:wrap; gap:4px; margin-bottom:8px; }
  .rte-bar button { min-width:34px; height:32px; padding:0 7px; border:1px solid var(--line); background:var(--surface); color:var(--fg); border-radius:4px; font-size:13px; font-weight:700; cursor:pointer; display:inline-flex; align-items:center; justify-content:center; font-family:inherit; }
  .rte-bar button:hover { border-color:var(--acc); }
  .rte-bar button svg { width:17px; height:17px; }
  .rte-bar .sep { width:8px; }
  .rte-tabs { display:flex; gap:2px; border-bottom:1px solid var(--line); margin-bottom:8px; }
  .rte-tabs button { background:none; border:none; border-bottom:2px solid transparent; color:var(--mut); font-size:13px; font-weight:600; padding:6px 10px; cursor:pointer; font-family:inherit; margin-bottom:-1px; }
  .rte-tabs button.on { color:var(--fg); border-bottom-color:var(--acc); }
  .rte-prev { min-height:160px; border:1px solid var(--line); border-radius:5px; padding:12px; background:var(--bg); overflow-wrap:anywhere; }
  .rt { line-height:1.6; overflow-wrap:anywhere; }
  .rt p { margin:0 0 10px; }
  .rt h2, .rt h3, .rt h4 { margin:16px 0 8px; font-weight:600; line-height:1.3; }
  .rt h2 { font-size:20px; } .rt h3 { font-size:17px; } .rt h4 { font-size:15px; }
  .rt ul, .rt ol { margin:0 0 10px; padding-left:22px; }
  .rt li { margin-bottom:4px; }
  .rt hr { border:none; border-top:1px solid var(--line); margin:16px 0; }
  .rt a { color:var(--acc); text-decoration:underline; }
  .rt img.rimg { max-width:100%; height:auto; border-radius:4px; margin:6px 0; display:block; }
  .rt .rvideo { position:relative; aspect-ratio:16/9; margin:12px 0; background:var(--bg); border-radius:4px; overflow:hidden; }
  .rt .rvideo iframe { position:absolute; inset:0; width:100%; height:100%; border:0; }
</style>
</head>
<body>

<!-- Menú Lateral -->
<div id="sidebarOverlay" class="sidebar-overlay"></div>
<aside id="sidebar" class="sidebar">
  <div class="sidebar-header">
    <h2 data-i18n="nav_title">Navegación</h2>
    <button class="btn sm" id="btnCloseSidebar">✕</button>
  </div>
  <div class="sidebar-links">
    <button class="on" data-nav="mods" data-i18n="nav_mods">Mods</button>
    <button data-nav="rules" data-i18n="nav_rules">Reglas</button>
    <button data-nav="info" data-i18n="nav_info">Información</button>
    <button data-nav="settings" data-i18n="nav_settings">Ajustes</button>
  </div>
</aside>

<header>
  <div class="top">
    <button id="btnOpenSidebar" class="nav-toggle" aria-label="Abrir menú">
      <svg class="ic"><use href="#i-menu"/></svg>
    </button>
    <a class="brand" href="./">
      <img src="logo.png" alt="Project Diva Logo">
    </a>

    <div class="header-acts">

function richText(body) { return renderRich(body); }

function saveSession(s) { session = s; if (s) localStorage.setItem("pdmm_session", JSON.stringify(s)); else { localStorage.removeItem("pdmm_session"); profile = null; mine = []; isMod = false; } renderAuth(); }

function renderAuth() {
  const logged = !!(session && session.access_token);
  $("btnOpenAuth").classList.toggle("hide", logged);
  ["btnOpenUpload", "btnProfile"].forEach((id) => $(id).classList.toggle("hide", !logged));
  if (logged) { $("hAv").innerHTML = avatarHtml(profile && profile.avatar_url, profile && profile.username, 22); $("hName").textContent = (profile && profile.username) || i18n[currentLang].profile; }
}

async function authCall(path, body) {
  const r = await fetch(URL_BASE + "/auth/v1/" + path, { method: "POST", headers: { apikey: KEY, "Content-Type": "application/json" }, body: JSON.stringify(body) });
  const d = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(d.msg || d.error_description || d.message || ("Error " + r.status));
  return d;
}

async function refreshIfNeeded() {
  if (!session || !session.refresh_token) return;
  if (session.expires_at && session.expires_at - Math.floor(Date.now() / 1000) > 60) return;
  try { saveSession(await authCall("token?grant_type=refresh_token", { refresh_token: session.refresh_token })); } catch (e) { saveSession(null); }
}

async function loadModFlag() {
  isMod = false; if (!session) return;
  try {
    const r = await fetch(URL_BASE + "/rest/v1/moderators?select=user_id&user_id=eq." + session.user.id, { headers: headers() });
    const d = await r.json(); isMod = Array.isArray(d) && d.length > 0;
  } catch (e) {}
}

async function loadProfile() {
  if (!session) return;
  const r = await fetch(URL_BASE + "/rest/v1/profiles?select=*&id=eq." + session.user.id, { headers: headers() });
  const d = await r.json().catch(() => []);
  profile = Array.isArray(d) ? d[0] || null : null;
  if (!profile) {
    const name = "user_" + session.user.id.slice(0, 6);
    await fetch(URL_BASE + "/rest/v1/profiles", { method: "POST", headers: headers({ "Content-Type": "application/json", Prefer: "resolution=merge-duplicates,return=minimal" }), body: JSON.stringify({ id: session.user.id, username: name }) });
    profile = { id: session.user.id, username: name, avatar_url: null };
  }
  await loadModFlag();
  renderAuth();
}

async function loadPages() {
  try {
    const r = await fetch(URL_BASE + "/rest/v1/site_pages?select=*", { headers: headers() });
    const d = await r.json();
    if (Array.isArray(d)) d.forEach((p) => { pages[p.key] = { title: p.title, body: p.body }; });
  } catch (e) {}
}

async function uploadFile(bucket, path, file) {
  const r = await fetch(URL_BASE + "/storage/v1/object/" + bucket + "/" + path, { method: "POST", headers: headers({ "Content-Type": file.type || "application/octet-stream" }), body: file });
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.message || e.error || ("Error al subir (" + r.status + ")")); }
  return URL_BASE + "/storage/v1/object/public/" + bucket + "/" + path;
}

function storagePath(url, bucket) { const p = "/storage/v1/object/public/" + bucket + "/"; const i = (url || "").indexOf(p); return i < 0 ? null : decodeURIComponent(url.slice(i + p.length)); }
async function removeFiles(bucket, urls) {
  const prefixes = urls.map((u) => storagePath(u, bucket)).filter(Boolean);
  if (!prefixes.length) return;
  await fetch(URL_BASE + "/storage/v1/object/" + bucket, { method: "DELETE", headers: headers({ "Content-Type": "application/json" }), body: JSON.stringify({ prefixes }) }).catch(() => {});
}

async function patchMod(id, body) {
  const r = await fetch(URL_BASE + "/rest/v1/mods?id=eq." + id, { method: "PATCH", headers: headers({ "Content-Type": "application/json", Prefer: "return=minimal" }), body: JSON.stringify(body) });
  if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.message || ("Error " + r.status)); }
}

// Cargar contadores globales de likes y comentarios para las tarjetas
async function loadSocialCounts() {
  try {
    const [rL, rC] = await Promise.all([
      fetch(URL_BASE + "/rest/v1/mod_likes?select=mod_id", { headers: headers() }),
      fetch(URL_BASE + "/rest/v1/mod_comments?select=mod_id", { headers: headers() })
    ]);
    const likes = await rL.json();
    const comments = await rC.json();
    
    modLikesMap = {};
    modCommentsMap = {};

    if (Array.isArray(likes)) {
      likes.forEach(l => { modLikesMap[l.mod_id] = (modLikesMap[l.mod_id] || 0) + 1; });
    }
    if (Array.isArray(comments)) {
      comments.forEach(c => { modCommentsMap[c.mod_id] = (modCommentsMap[c.mod_id] || 0) + 1; });
    }
  } catch(e) {}
}

function gbItemHtml(m) {
  const img = (m.images || [])[0];
  const catKey = "cat_" + (m.category || "other");
  const catLabel = i18n[currentLang][catKey] || m.category || "Otro";
  const likesCount = modLikesMap[m.id] || 0;
  const commsCount = modCommentsMap[m.id] || 0;

  return `<div class="gb-card" data-id="${esc(m.id)}">
    <div class="gb-thumb">
      ${safeUrl(img) ? `<img class="cover" src="${esc(img)}" alt="" loading="lazy">` : `<img class="ph" src="logo.png" alt="">`}
      <span class="badge-cat">${esc(catLabel)}</span>
    </div>
    <div class="gb-info">
      <h3 class="gb-title">${esc(m.title)}</h3>
      <div class="gb-author" data-user="${esc(m.user_id)}">${avatarHtml(m.profiles && m.profiles.avatar_url, authorOf(m), 16)}<span>${esc(authorOf(m))}</span></div>
      <div class="gb-stats">
        <span>${ic("i-dl")}${m.downloads || 0}</span>
        <span>${ic("i-heart")}${likesCount}</span>
        <span>${ic("i-comm")}${commsCount}</span>
        <span class="date">${fmtDate(m.created_at)}</span>
      </div>
    </div>
  </div>`;
}

function renderMods() {
  const q = $("q").value.trim().toLowerCase();
  const items = allMods.filter((m) => {
    const matchQuery = ((m.title || "") + " " + authorOf(m) + " " + (m.description || "")).toLowerCase().includes(q);
    const matchCat = selectedCat === "all" || (m.category || "other") === selectedCat;
    return matchQuery && matchCat;
  });
  
  items.sort((a, b) => {
    if (sortOrder === "created_at_desc") return new Date(b.created_at) - new Date(a.created_at);
    if (sortOrder === "created_at_asc") return new Date(a.created_at) - new Date(b.created_at);
    if (sortOrder === "downloads_desc") return (b.downloads || 0) - (a.downloads || 0);
    if (sortOrder === "views_desc") return (b.views || 0) - (a.views || 0);
    return 0;
  });

  const tLang = i18n[currentLang];
  $("count").textContent = items.length + " " + (items.length === 1 ? "mod" : "mods");
  $("list").innerHTML = items.length ? items.map(gbItemHtml).join("") : "<div class='empty'>" + (allMods.length ? (currentLang === 'es' ? "Sin resultados para este filtro." : "No results for this filter.") : tLang.loading) + "</div>";
}

$("catSelect").onchange = (e) => {
  selectedCat = e.target.value;
  renderMods();
};

$("sortSelect").onchange = (e) => {
  sortOrder = e.target.value;
  renderMods();
};

async function loadMods() {
  try {
    await loadSocialCounts();
    const r = await fetch(URL_BASE + "/rest/v1/mods?select=*,profiles(username,avatar_url)&approved=eq.true&hidden=eq.false&order=created_at.desc", { headers: headers() });
    const d = await r.json();
    if (!r.ok) throw new Error(d.message || ("Error " + r.status));
    allMods = Array.isArray(d) ? d : []; 
    renderMods();
    checkUrlHash();
  } catch (e) { $("list").innerHTML = "<div class='empty'>Error: " + esc(e.message) + "</div>"; }
}

async function loadMine() {
  if (!session) return;
  const r = await fetch(URL_BASE + "/rest/v1/mods?select=*&user_id=eq." + session.user.id + "&order=created_at.desc", { headers: headers() });
  const d = await r.json().catch(() => []);
  mine = Array.isArray(d) ? d : [];
}

function rpc(fn, id) { return fetch(URL_BASE + "/rest/v1/rpc/" + fn, { method: "POST", headers: headers({ "Content-Type": "application/json" }), body: JSON.stringify({ mod_id: id }) }).catch(() => {}); }
const findMod = (id) => mine.find((x) => x.id === id) || allMods.find((x) => x.id === id) || userMods.find((x) => x.id === id);

// Social (Likes & Comentarios)
async function getLikes(modId) {
  try {
    const r = await fetch(URL_BASE + "/rest/v1/mod_likes?select=user_id&mod_id=eq." + modId, { headers: headers() });
    const d = await r.json();
    return Array.isArray(d) ? d : [];
  } catch(e) { return []; }
}

async function toggleLike(modId, btn) {
  if (!session) return toast("Inicia sesión para dar Like.");
  btn.disabled = true;
  const myUid = session.user.id;
  try {
    const likes = await getLikes(modId);
    const hasLiked = likes.some(l => l.user_id === myUid);
    if (hasLiked) {
      await fetch(URL_BASE + "/rest/v1/mod_likes?mod_id=eq." + modId + "&user_id=eq." + myUid, { method: "DELETE", headers: headers() });
    } else {
      await fetch(URL_BASE + "/rest/v1/mod_likes", { method: "POST", headers: headers({ "Content-Type": "application/json" }), body: JSON.stringify({ mod_id: modId, user_id: myUid }) });
    }
    await loadSocialCounts();
    await loadModSocialData(modId);
    renderMods();
  } catch(e) { toast("Error con el like"); } finally { btn.disabled = false; }
}

async function loadComments(modId) {
  try {
    const rC = await fetch(URL_BASE + "/rest/v1/mod_comments?select=*&mod_id=eq." + modId + "&order=created_at.asc", { headers: headers() });
    const comments = await rC.json();
    if (!rC.ok || !Array.isArray(comments) || !comments.length) return [];

    const userIds = [...new Set(comments.map(c => c.user_id))];
    const rP = await fetch(URL_BASE + "/rest/v1/profiles?select=id,username,avatar_url&id=in.(" + userIds.join(",") + ")", { headers: headers() });
    const profiles = await rP.json().catch(() => []);
    
    const profMap = {};
    if (Array.isArray(profiles)) {
      profiles.forEach(p => { profMap[p.id] = p; });
    }

    return comments.map(c => ({
      ...c,
      profile: profMap[c.user_id] || { username: "Usuario", avatar_url: null }
    }));
  } catch(e) { 
    return []; 
  }
}

async function sendComment(modId, content, parentId) {
  if (!session || !session.user) { toast("Inicia sesión para comentar."); return false; }
  content = content.trim();
  if (!content) return false;
  if (!checkRespect(content)) { toast("Mantén un tono respetuoso y libre de insultos."); return false; }
  await refreshIfNeeded();
  try {
    const body = { mod_id: modId, user_id: session.user.id, content: content };
    if (parentId) body.parent_id = parentId;
    const res = await fetch(URL_BASE + "/rest/v1/mod_comments", {
      method: "POST",
      headers: headers({ "Content-Type": "application/json", Prefer: "return=minimal" }),
      body: JSON.stringify(body)
    });
    if (!res.ok) {
      const d = await res.json().catch(() => ({}));
      const msg = d.message || d.hint || "No se pudo guardar el comentario";
      throw new Error(/parent_id/.test(msg) ? "Falta ejecutar el SQL de respuestas en Supabase." : msg);
    }
    await loadSocialCounts();
    await loadModSocialData(modId);
    renderMods();
    return true;
  } catch (e) {
    toast("Error: " + e.message);
    return false;
  }
}

async function postComment(modId) {
  const input = $("cInput"), btn = $("btnPostC");
  btn.disabled = true;
  const ok = await sendComment(modId, input.value, null);
  btn.disabled = false;
  if (ok) { input.value = ""; toast("Comentario publicado."); }
}

async function deleteComment(id, modId) {
  if (!confirm("¿Eliminar este comentario? También se borrarán sus respuestas.")) return;
  try {
    const r = await fetch(URL_BASE + "/rest/v1/mod_comments?id=eq." + id, { method: "DELETE", headers: headers({ Prefer: "return=representation" }) });
    const d = await r.json().catch(() => []);
    if (!r.ok) throw new Error((d && d.message) || ("Error " + r.status));
    if (Array.isArray(d) && !d.length) throw new Error("No tienes permiso para borrar este comentario.");
    await loadSocialCounts();
    await loadModSocialData(modId);
    renderMods();
    toast("Comentario eliminado.");
  } catch (e) { toast("Error: " + e.message); }
}

function commentHtml(c, rootId) {
  const uName = c.profile.username || "Usuario";
  const isAuthor = currentMod && c.user_id === currentMod.user_id;
  const me = myId();
  const canDel = me && (c.user_id === me || isMod);
  return `<div class="cm">
    <div class="cm-head">
      <span class="cm-who" data-user="${esc(c.user_id)}">${avatarHtml(c.profile.avatar_url, uName, 22)}<span class="cm-user">${esc(uName)}</span></span>
      ${isAuthor ? `<span class="tag">Autor</span>` : ""}
      <span class="cm-time">${fmtDate(c.created_at)}</span>
    </div>
    <div class="cm-text">${esc(c.content)}</div>
    <div class="cm-acts">
      <button class="linkbtn" data-reply="${esc(c.id)}" data-root="${esc(rootId)}" data-rname="${esc(uName)}" data-isroot="${c.id === rootId ? 1 : 0}">Responder</button>
      ${canDel ? `<button class="linkbtn danger" data-delc="${esc(c.id)}">Eliminar</button>` : ""}
    </div>
    <div id="slot-${esc(c.id)}"></div>
  </div>`;
}

async function loadModSocialData(id) {
  const likes = await getLikes(id);
  const comments = await loadComments(id);
  const myUid = myId();
  const isLiked = likes.some(l => l.user_id === myUid);

  const lBtn = $("btnLike");
  if (lBtn) {
    lBtn.className = "like-btn " + (isLiked ? "liked" : "");
    lBtn.innerHTML = `${ic("i-heart")} <span>${likes.length} ${likes.length === 1 ? 'Like' : 'Likes'}</span>`;
    lBtn.onclick = () => toggleLike(id, lBtn);
  }

  const cList = $("commentsList");
  if (cList) {
    const roots = comments.filter(c => !c.parent_id).sort((x, y) => new Date(y.created_at) - new Date(x.created_at));
    const kids = {};
    comments.filter(c => c.parent_id).forEach(c => { (kids[c.parent_id] = kids[c.parent_id] || []).push(c); });
    cList.innerHTML = roots.length ? roots.map(c => {
      const rs = kids[c.id] || [];
      return commentHtml(c, c.id) + (rs.length ? `<div class="replies">${rs.map(r => commentHtml(r, c.id)).join("")}</div>` : "");
    }).join("") : `<p class="hint">Sé el primero en dejar un comentario respetuoso sobre este mod.</p>`;
  }
}

function wireComments(modId) {
  const list = $("commentsList");
  list.onclick = async (e) => {
    const rb = e.target.closest("[data-reply]");
    if (rb) {
      if (!session) return toast("Inicia sesión para responder.");
      document.querySelectorAll(".cm-form").forEach(f => f.remove());
      const slot = $("slot-" + rb.dataset.reply);
      if (!slot) return;
      const prefix = rb.dataset.isroot === "1" ? "" : "@" + rb.dataset.rname + " ";
      slot.innerHTML = `<div class="cm-form"><input maxlength="250" value="${esc(prefix)}" placeholder="Responder a ${esc(rb.dataset.rname)}..."><button class="btn pri sm" data-send="${esc(rb.dataset.root)}">Enviar</button><button class="btn sm" data-cancel>Cancelar</button></div>`;
      const inp = slot.querySelector("input");
      inp.focus();
      inp.setSelectionRange(inp.value.length, inp.value.length);
      return;
    }
    if (e.target.closest("[data-cancel]")) { e.target.closest(".cm-form").remove(); return; }
    const sb = e.target.closest("[data-send]");
    if (sb) {
      const inp = sb.closest(".cm-form").querySelector("input");
      sb.disabled = true;
      const ok = await sendComment(modId, inp.value, sb.dataset.send);
      if (ok) toast("Respuesta publicada."); else sb.disabled = false;
      return;
    }
    const db = e.target.closest("[data-delc]");
    if (db) deleteComment(db.dataset.delc, modId);
  };
  list.onkeydown = (e) => {
    if (e.key === "Enter" && e.target.matches(".cm-form input")) {
      e.preventDefault();
      e.target.closest(".cm-form").querySelector("[data-send]").click();
    }
  };
  $("cInput").onkeydown = (e) => { if (e.key === "Enter") { e.preventDefault(); postComment(modId); } };
}

// Abrir Mod en Vista de Página Independiente
function openModPage(id) {
  const m = allMods.find((x) => x.id === id) || userMods.find((x) => x.id === id); 
  if (!m) return;

  currentMod = m;
  window.location.hash = "mod=" + id;
  rpc("increment_views", id); m.views = (m.views || 0) + 1; renderMods();

  const link = safeUrl(m.file_url) || safeUrl(m.external_url);
  const imgs = (m.images || []).filter(safeUrl);
  const owner = isOwner(m);
  const tLang = i18n[currentLang];
  let acts = "";
  if (owner) acts = `<div class="acts" style="margin-top:12px"><button class="btn sm" data-act="edit" data-id="${esc(m.id)}">${tLang.edit}</button><button class="btn sm" data-act="hide" data-id="${esc(m.id)}">${tLang.hide}</button><button class="btn sm danger" data-act="del" data-id="${esc(m.id)}">${tLang.delete}</button></div>`;
  if (!owner && isMod) acts = `<p class="hint" style="margin-top:14px">Moderación</p><div class="acts" style="margin-top:4px"><button class="btn sm" data-act="hide" data-id="${esc(m.id)}">${tLang.hide}</button><button class="btn sm danger" data-act="del" data-id="${esc(m.id)}">${tLang.delete}</button></div>`;

  $("modPageContent").innerHTML = `
    ${imgs.length ? `<div class="gallery">${imgs.map((u) => `<img src="${esc(u)}" alt="">`).join("")}</div>` : ""}
    <div class="mod-header-row">
      <div>
        <h1 class="mod-title">${esc(m.title)}</h1>
        <div class="who" data-user="${esc(m.user_id)}" style="font-size:15px;display:flex;align-items:center;gap:8px;cursor:pointer">${avatarHtml(m.profiles && m.profiles.avatar_url, authorOf(m), 26)}<span>${esc(authorOf(m))}</span></div>
      </div>
      <button id="btnLike" class="like-btn">${ic("i-heart")} <span>0 Likes</span></button>
    </div>

    <div class="gb-stats" style="margin-bottom:16px;font-size:13.5px">
      <span>${ic("i-dl")}<b id="dlCount">${m.downloads || 0}</b> descargas</span>
      <span>${ic("i-eye")}${m.views} vistas</span>
      <span>${fmtDate(m.created_at)}</span>
    </div>

    <div class="rt" style="margin:12px 0 18px">${renderRich(m.description)}</div>

    ${link ? `<a id="dlBtn" class="btn pri" style="display:flex;padding:12px 24px;font-size:16px;width:100%" href="${esc(link)}" target="_blank" rel="noopener">${tLang.download_btn}</a>` : ""}
    ${acts}

    <div class="comments-sec">
      <h3 class="sec-title">Comentarios</h3>
      <div class="comment-box">
        <input id="cInput" placeholder="Escribe un comentario..." maxlength="250">
        <button id="btnPostC" class="btn pri sm">Enviar</button>
      </div>
      <div id="commentsList">Cargando comentarios...</div>
    </div>`;

  $("mainView").classList.add("hide");
  $("modPageContainer").classList.remove("hide");
  window.scrollTo({ top: 0, behavior: "smooth" });

  const b = $("dlBtn");
  if (b) b.onclick = () => { rpc("increment_downloads", id); m.downloads = (m.downloads || 0) + 1; $("dlCount").textContent = m.downloads; renderMods(); };
  $("btnPostC").onclick = () => postComment(id);
  wireComments(id);

  loadModSocialData(id);
}

function closeModPage() {
  currentMod = null;
  window.location.hash = "";
  $("modPageContainer").classList.add("hide");
  $("mainView").classList.remove("hide");
}

$("btnBackToList").onclick = closeModPage;

function checkUrlHash() {
  const hash = window.location.hash;
  if (hash.startsWith("#mod=")) {
    const id = hash.replace("#mod=", "");
    if (id) openModPage(id);
  } else {
    closeModPage();
  }
}
window.onhashchange = checkUrlHash;

$("list").onclick = (e) => {
  const u = e.target.closest("[data-user]"); if (u) { openUser(u.dataset.user); return; }
  const c = e.target.closest(".gb-card"); if (c) openModPage(c.dataset.id);
};

$("modPageContent").onclick = (e) => {
  const u = e.target.closest("[data-user]"); if (u) { openUser(u.dataset.user); return; }
  onAction(e);
};

async function openUser(uid) {
  if (!isUuid(uid)) return;
  const tLang = i18n[currentLang];
  $("userBody").innerHTML = `<p class='hint'>${tLang.loading}</p>`;
  if (!$("userDlg").open) $("userDlg").showModal();
  try {
    const [pr, mr] = await Promise.all([
      fetch(URL_BASE + "/rest/v1/profiles?select=*&id=eq." + uid, { headers: headers() }).then((r) => r.json()).catch(() => []),
      fetch(URL_BASE + "/rest/v1/mods?select=*,profiles(username,avatar_url)&user_id=eq." + uid + "&approved=eq.true&hidden=eq.false&order=created_at.desc", { headers: headers() }).then((r) => r.json()).catch(() => []),
    ]);
    const p = Array.isArray(pr) ? pr[0] : null;
    if (!p) { $("userBody").innerHTML = `<p class='hint'>Perfil no encontrado.</p>`; return; }
    userMods = Array.isArray(mr) ? mr : [];
    const own = myId() === uid;
    const totalDl = userMods.reduce((s, m) => s + (m.downloads || 0), 0);
    $("userBody").innerHTML = `
      <div class="uhead">${avatarHtml(p.avatar_url, p.username, 56)}
        <div><h2 style="margin:0">${esc(p.username)}</h2>
          <div class="hint">${tLang.member_since} ${esc(new Date(p.created_at).toLocaleDateString(currentLang === 'es' ? "es" : "en", { month: "long", year: "numeric" }))}</div>
          ${own && isMod ? `<span class="chip ok" style="margin:4px 0 0">${tLang.moderator}</span>` : ""}</div></div>

// ---------- Editor de texto enriquecido (formato tipo GameBanana) ----------
function rtInlineFmt(t) {
  return t
    .replace(/\*\*(.+?)\*\*/g, "<b>$1</b>")
    .replace(/(^|[^*])\*(?!\s)([^*]+?)\*(?!\*)/g, "$1<i>$2</i>")
    .replace(/__(.+?)__/g, "<u>$1</u>")
    .replace(/~~(.+?)~~/g, "<s>$1</s>");
}
function rtInline(t) {
  const toks = [];
  const keep = (html) => "\u0000" + (toks.push(html) - 1) + "\u0000";
  t = t.replace(/!\[([^\]]*)\]\((https:\/\/[^\s)]+)\)/g, (m, alt, url) => keep(`<img class="rimg" src="${url}" alt="${alt}" loading="lazy" referrerpolicy="no-referrer">`));
  t = t.replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, (m, txt, url) => keep(`<a href="${url}" target="_blank" rel="noopener noreferrer nofollow">${rtInlineFmt(txt)}</a>`));
  t = rtInlineFmt(t);
  for (let n = 0; n < 4 && /\u0000\d+\u0000/.test(t); n++) t = t.replace(/\u0000(\d+)\u0000/g, (m, i) => toks[+i]);
  return t;
}
function renderRich(src) {
  const lines = String(src || "").replace(/\r/g, "").split("\n");
  let html = "", list = null, para = [];
  const flushP = () => { if (para.length) { html += "<p>" + para.map((l) => rtInline(esc(l))).join("<br>") + "</p>"; para = []; } };
  const closeList = () => { if (list) { html += "</" + list + ">"; list = null; } };
  for (const raw of lines) {
    const line = raw.trimEnd();
    let m;
    if (!line.trim()) { flushP(); closeList(); continue; }
    if ((m = line.match(/^\s*\[video\]\(https:\/\/(?:www\.|m\.)?(?:youtube\.com\/watch\?[^\s)]*v=|youtu\.be\/)([\w-]{11})[^\s)]*\)\s*$/))) {
      flushP(); closeList();
      html += `<div class="rvideo"><iframe src="https://www.youtube-nocookie.com/embed/${m[1]}" loading="lazy" allowfullscreen referrerpolicy="strict-origin-when-cross-origin" allow="encrypted-media; picture-in-picture"></iframe></div>`;
      continue;
    }
    if (/^\s*---+\s*$/.test(line)) { flushP(); closeList(); html += "<hr>"; continue; }
    if ((m = line.match(/^(#{1,3})\s+(.+)$/))) { flushP(); closeList(); const n = m[1].length + 1; html += `<h${n}>${rtInline(esc(m[2]))}</h${n}>`; continue; }
    if ((m = line.match(/^\s*[-•]\s+(.+)$/)) || (m = line.match(/^\s*\*\s+(.+)$/))) {
      flushP(); if (list !== "ul") { closeList(); html += "<ul>"; list = "ul"; }
      html += "<li>" + rtInline(esc(m[1])) + "</li>"; continue;
    }
    if ((m = line.match(/^\s*\d+[.)]\s+(.+)$/))) {
      flushP(); if (list !== "ol") { closeList(); html += "<ol>"; list = "ol"; }
      html += "<li>" + rtInline(esc(m[1])) + "</li>"; continue;
    }
    closeList(); para.push(line);
  }
  flushP(); closeList();
  return html;
}

function rteInsert(ta, text, s0, e0) {
  ta.focus(); ta.setSelectionRange(s0, e0);
  let ok = false;
  try { ok = document.execCommand && document.execCommand("insertText", false, text); } catch (e) {}
  if (!ok) { ta.setRangeText(text, s0, e0, "end"); ta.dispatchEvent(new Event("input", { bubbles: true })); }
}
function rteWrap(ta, before, after, placeholder) {
  const s0 = ta.selectionStart, e0 = ta.selectionEnd;
  const sel = ta.value.slice(s0, e0) || placeholder;
  rteInsert(ta, before + sel + after, s0, e0);
  ta.setSelectionRange(s0 + before.length, s0 + before.length + sel.length);
}
function rteLines(ta, fn) {
  const v = ta.value, s0 = ta.selectionStart, e0 = ta.selectionEnd;
  const ls = v.lastIndexOf("\n", s0 - 1) + 1;
  let le = v.indexOf("\n", e0); if (le < 0) le = v.length;
  const block = v.slice(ls, le).split("\n").map(fn).join("\n");
  rteInsert(ta, block, ls, le);
  ta.setSelectionRange(ls, ls + block.length);
}
function rteHeading(ta, n) {
  const mark = "#".repeat(n) + " ";
  rteLines(ta, (l) => { const plain = l.replace(/^#{1,3}\s+/, ""); return l.startsWith(mark) ? plain : mark + plain; });
}
function rteList(ta, ordered) {
  const v = ta.value, s0 = ta.selectionStart, e0 = ta.selectionEnd;
  const ls = v.lastIndexOf("\n", s0 - 1) + 1; let le = v.indexOf("\n", e0); if (le < 0) le = v.length;
  const rows = v.slice(ls, le).split("\n");
  const re = ordered ? /^\d+[.)]\s+/ : /^[-•]\s+/;
  const all = rows.every((l) => re.test(l));
  rteLines(ta, (l, i) => {
    const plain = l.replace(/^(\d+[.)]|[-•])\s+/, "");
    return all ? plain : (ordered ? (i + 1) + ". " : "- ") + plain;
  });
}
function rteBlockInsert(ta, text) {
  const s0 = ta.selectionStart, e0 = ta.selectionEnd, v = ta.value;
  const pre = s0 > 0 && v[s0 - 1] !== "\n" ? "\n" : "";
  const post = e0 < v.length && v[e0] !== "\n" ? "\n" : "";
  rteInsert(ta, pre + text + post, s0, e0);
}
function rteAction(ta, act) {
  const sel = ta.value.slice(ta.selectionStart, ta.selectionEnd);
  if (act === "b") rteWrap(ta, "**", "**", "texto");
  else if (act === "i") rteWrap(ta, "*", "*", "texto");
  else if (act === "u") rteWrap(ta, "__", "__", "texto");
  else if (act === "s") rteWrap(ta, "~~", "~~", "texto");
  else if (act === "h1") rteHeading(ta, 1);
  else if (act === "h2") rteHeading(ta, 2);
  else if (act === "h3") rteHeading(ta, 3);
  else if (act === "ul") rteList(ta, false);
  else if (act === "ol") rteList(ta, true);
  else if (act === "hr") rteBlockInsert(ta, "---");
  else if (act === "link") {
    const txt = prompt(T("rte_link_text"), sel || ""); if (txt === null) return;
    const url = (prompt(T("rte_link_url"), "https://") || "").trim(); if (!url) return;
    if (!/^https?:\/\/\S+$/i.test(url) || /[()]/.test(url)) return toast(T("rte_bad_url"));
    rteInsert(ta, "[" + (txt.trim() || url) + "](" + url + ")", ta.selectionStart, ta.selectionEnd);
  } else if (act === "img") {
    const url = (prompt(T("rte_img_url"), "https://") || "").trim(); if (!url) return;
    if (!/^https:\/\/\S+$/i.test(url) || /[()]/.test(url)) return toast(T("rte_bad_url"));
    rteBlockInsert(ta, "![](" + url + ")");
  } else if (act === "vid") {
    const url = (prompt(T("rte_vid_url"), "https://") || "").trim(); if (!url) return;
    if (!/^https:\/\/(?:www\.|m\.)?(?:youtube\.com\/watch\?\S*v=|youtu\.be\/)[\w-]{11}\S*$/i.test(url) || /[()]/.test(url)) return toast(T("rte_bad_video"));
    rteBlockInsert(ta, "[video](" + url + ")");
  } else if (act === "undo") { ta.focus(); document.execCommand && document.execCommand("undo"); }
  else if (act === "redo") { ta.focus(); document.execCommand && document.execCommand("redo"); }
}
const RTE_BTNS = [
  ["b", "<b>B</b>"], ["i", "<i>I</i>"], ["u", "<u>U</u>"], ["s", "<s>S</s>"], null,
  ["h1", "H1"], ["h2", "H2"], ["h3", "H3"], null,
  ["ul", "•"], ["ol", "1."], ["hr", "—"], null,
  ["link", '<svg><use href="#i-link"/></svg>'], ["img", '<svg><use href="#i-image"/></svg>'], ["vid", '<svg><use href="#i-video"/></svg>'], null,
  ["undo", '<svg><use href="#i-undo"/></svg>'], ["redo", '<svg><use href="#i-redo"/></svg>']
];
function rteBackToWrite(id) {
  const w = document.querySelector('.rte[data-ta="' + id + '"] [data-tab="write"]');
  if (w) w.click();
}
function initRte(id) {
  const ta = $(id); if (!ta) return;
  const wrap = document.createElement("div");
  wrap.className = "rte"; wrap.dataset.ta = id;
  const label = ta.closest("label");
  const anchor = label || ta;
  // si el textarea está dentro de un <label>, el editor se arma justo después del texto del campo
  wrap.innerHTML = `<div class="rte-bar">${RTE_BTNS.map((b) => b ? `<button type="button" data-act="${b[0]}">${b[1]}</button>` : '<span class="sep"></span>').join("")}</div>
    <div class="rte-tabs"><button type="button" class="on" data-tab="write" data-i18n="rte_write">Escribir</button><button type="button" data-tab="preview" data-i18n="rte_preview">Vista previa</button></div>
    <div class="rte-prev rt hide"></div>`;
  ta.parentNode.insertBefore(wrap, ta);
  wrap.insertBefore(ta, wrap.querySelector(".rte-prev"));
  const bar = wrap.querySelector(".rte-bar"), prev = wrap.querySelector(".rte-prev");
  bar.addEventListener("mousedown", (e) => e.preventDefault());
  bar.addEventListener("click", (e) => { const b = e.target.closest("[data-act]"); if (b) rteAction(ta, b.dataset.act); });
  wrap.querySelector(".rte-tabs").addEventListener("click", (e) => {
    const t = e.target.closest("[data-tab]"); if (!t) return;
    wrap.querySelectorAll(".rte-tabs button").forEach((x) => x.classList.toggle("on", x === t));
    const preview = t.dataset.tab === "preview";
    bar.classList.toggle("hide", preview); ta.classList.toggle("hide", preview); prev.classList.toggle("hide", !preview);
    if (preview) prev.innerHTML = ta.value.trim() ? renderRich(ta.value) : `<p class="hint">${esc(T("rte_empty"))}</p>`;
  });
}

  const b = $("fileBox"); if (!b) return;
  if (!upFile) {
    b.innerHTML = `<button type="button" class="filepick" id="filePick">${icUse("i-file")}<span><b>${esc(T("up_file_add"))}</b><small>${esc(T("up_file_hint"))}</small></span></button>`;
    return;
  }
  const big = upFile.size > MAX_FILE;
  b.innerHTML = `<div class="filecard ${big ? "bad" : ""}">${icUse(big ? "i-file" : "i-check")}<div class="fc-t"><b>${esc(upFile.name)}</b><small>${fmtSize(upFile.size)}${big ? " · " + esc(T("up_err_big_short")) : ""}</small></div><button type="button" class="linkbtn" id="fileRm">${esc(T("up_file_remove"))}</button></div>`;
}

function addUpImgs(files) {
  let big = false, notImg = false, tooMany = false;
  files.forEach((f) => {
    if (!/^image\//.test(f.type)) { notImg = true; return; }
    if (f.size > MAX_IMG) { big = true; return; }
    if (upImgs.length >= MAX_IMGS) { tooMany = true; return; }
    upImgs.push({ file: f, url: URL.createObjectURL(f) });
  });
  renderUpImgs();
  if (tooMany) toast(T("up_err_img_max")); else if (big) toast(T("up_err_img_big")); else if (notImg) toast(T("up_err_img_type"));
}

function resetUpload() {
  upImgs.forEach((it) => URL.revokeObjectURL(it.url));
  upImgs = []; upFile = null;
  ["title", "desc", "ext"].forEach((id) => ($(id).value = ""));
  $("category").value = "other"; $("descCount").textContent = "0/5000";
  rteBackToWrite("desc");
  renderUpImgs(); renderUpFile();
}

function xhrUpload(bucket, path, file, onProg) {
  return new Promise((resolve, reject) => {
    const x = new XMLHttpRequest();
    x.open("POST", URL_BASE + "/storage/v1/object/" + bucket + "/" + path);
    const h = headers({ "Content-Type": file.type || "application/octet-stream" });
    Object.keys(h).forEach((k) => x.setRequestHeader(k, h[k]));
    x.upload.onprogress = (e) => { if (e.lengthComputable) onProg(e.loaded); };
    x.onload = () => {
      if (x.status >= 200 && x.status < 300) return resolve(URL_BASE + "/storage/v1/object/public/" + bucket + "/" + path);
      let m = ""; try { const j = JSON.parse(x.responseText); m = j.message || j.error; } catch (e) {}
      reject(new Error(m || ("Error " + x.status)));
    };
    x.onerror = () => reject(new Error("Sin conexión / No connection"));
    x.send(file);
  });
}

$("imgs").onchange = () => { addUpImgs(Array.from($("imgs").files)); $("imgs").value = ""; };
$("imgGrid").onclick = (e) => {
  const rm = e.target.closest("[data-rm]");
  if (rm) { const i = +rm.dataset.rm; URL.revokeObjectURL(upImgs[i].url); upImgs.splice(i, 1); renderUpImgs(); return; }
  if (e.target.closest("#imgAdd")) { $("imgs").click(); return; }
  const th = e.target.closest(".ithumb");
  if (th) { const i = +th.dataset.i; if (i > 0) { const it = upImgs.splice(i, 1)[0]; upImgs.unshift(it); renderUpImgs(); } }
};
$("file").onchange = () => {
  const f = $("file").files[0]; $("file").value = "";
  if (!f) return;
  if (!/\.(zip|7z|rar)$/i.test(f.name)) return toast(T("up_err_type"));
  upFile = f; renderUpFile();
};
$("fileBox").onclick = (e) => {
  if (e.target.closest("#filePick")) $("file").click();
  else if (e.target.closest("#fileRm")) { upFile = null; renderUpFile(); }
};
$("desc").oninput = () => { $("descCount").textContent = $("desc").value.length + "/5000"; };
$("upDlg").addEventListener("close", () => { if (upBusy) { $("upDlg").showModal(); toast(T("up_wait")); } });

$("eImgs").onchange = () => { const n = $("eImgs").files.length; $("eImgName").textContent = n ? n + " " + T("up_new_imgs") : T("add_more_imgs"); };
$("eFile").onchange = () => { const f = $("eFile").files[0]; $("eFileName").textContent = f ? f.name + " (" + fmtSize(f.size) + ")" : T("replace_file"); };

$("btnUpload").onclick = async () => {
  if (upBusy) return;
  const title = $("title").value.trim(), category = $("category").value, description = $("desc").value.trim();
  const ext = $("ext").value.trim();
  if (!title) return toast(T("up_err_title"));
  if (!upFile && !ext) return toast(T("up_err_source"));
  if (upFile && upFile.size > MAX_FILE) return toast(T("up_err_big"));
  if (ext && !/^https?:\/\//i.test(ext)) return toast(T("up_err_link"));
  await refreshIfNeeded(); if (!session) return toast(T("up_err_login"));
  if (!profile) await loadProfile();

  const uid = session.user.id, stamp = Date.now();
  const tasks = upImgs.map((it, i) => ({ bucket: "images", path: uid + "/" + stamp + "_" + i + "_" + safeName(it.file.name), file: it.file, kind: "img" }));
  if (upFile) tasks.push({ bucket: "mods", path: uid + "/" + stamp + "_" + safeName(upFile.name), file: upFile, kind: "file" });
  const total = tasks.reduce((n, t) => n + t.file.size, 0) || 1;
  const loaded = tasks.map(() => 0), urls = tasks.map(() => null);
  let finished = 0, failed = null;

  const btn = $("btnUpload");
  upBusy = true; btn.disabled = true;
  $("upProgress").classList.remove("hide");
  const paint = () => {
    const pct = Math.min(100, Math.round(loaded.reduce((a, c) => a + c, 0) / total * 100));
    $("upBar").style.width = pct + "%";
    $("upStatus").textContent = T("up_uploading") + " " + finished + "/" + tasks.length + " · " + pct + "%";
    btn.textContent = pct + "%";
  };
  paint();

  try {
    let next = 0;
    const worker = async () => {
      while (!failed) {
        const i = next++; if (i >= tasks.length) return;
        try {
          urls[i] = await xhrUpload(tasks[i].bucket, tasks[i].path, tasks[i].file, (n) => { loaded[i] = n; paint(); });
          loaded[i] = tasks[i].file.size; finished++; paint();
        } catch (e) { failed = failed || e; }
      }
    };
    await Promise.all(Array.from({ length: Math.min(3, tasks.length) }, worker));
    if (failed) throw failed;

    $("upStatus").textContent = T("up_saving");
    const imageUrls = tasks.map((t, i) => (t.kind === "img" ? urls[i] : null)).filter(Boolean);
    const fi = tasks.findIndex((t) => t.kind === "file");
    const fileUrl = fi >= 0 ? urls[fi] : null;

    const ins = await fetch(URL_BASE + "/rest/v1/mods", { method: "POST", headers: headers({ "Content-Type": "application/json", Prefer: "return=minimal" }),
      body: JSON.stringify({ title, category, description, author: (profile && profile.username) || "Anónimo", file_url: fileUrl, external_url: ext || null, images: imageUrls, approved: true, user_id: session.user.id }) });
    if (!ins.ok) { const e = await ins.json().catch(() => ({})); throw new Error(e.message || ("Error " + ins.status)); }

    upBusy = false;
    $("upDlg").close();
    toast(T("up_done"));
    resetUpload();
    loadMods();
  } catch (e) {
    await removeFiles("images", tasks.map((t, i) => (t.kind === "img" ? urls[i] : null)).filter(Boolean));
    await removeFiles("mods", tasks.map((t, i) => (t.kind === "file" ? urls[i] : null)).filter(Boolean));
    toast("Error: " + e.message);
  } finally {
    upBusy = false; btn.disabled = false; btn.textContent = T("btn_upload_mod");
    $("upProgress").classList.add("hide"); $("upBar").style.width = "0";
  }
};

// Inicialización
setTheme(currentTheme);
setLanguage(currentLang);

renderAuth();
refreshIfNeeded().then(loadProfile);
loadPages();
loadMods();
</script>
</body>
</html>
