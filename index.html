<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDMM+ Mods</title>
<link rel="icon" href="logo.png">
<style>
  :root { 
    --bg:#0e121b; --surface:#151b27; --line:#232d3f; --fg:#e6e9ee; --mut:#8a93a1; 
    --acc:#2fd4c6; --acc-fg:#04201d; --yellow:#facc15; --danger:#f0686b; --radius:8px;
  }
  html[data-theme="light"] {
    --bg:#f1f4f8; --surface:#ffffff; --line:#dbe1e8; --fg:#1b1f24; --mut:#667085; 
    --acc:#0f9d93; --acc-fg:#ffffff; --yellow:#d97706; --danger:#dc2626;
  }
  * { box-sizing:border-box; }
  body { margin:0; font-family:"Inter","Segoe UI",Roboto,system-ui,sans-serif; background:var(--bg); color:var(--fg); line-height:1.45; }
  .ic { width:16px; height:16px; vertical-align:-2px; flex:none; }

  /* Scrollbars */
  ::-webkit-scrollbar { width:8px; height:8px; }
  ::-webkit-scrollbar-track { background:var(--bg); }
  ::-webkit-scrollbar-thumb { background:var(--line); border-radius:4px; }
  ::-webkit-scrollbar-thumb:hover { background:var(--mut); }
  * { scrollbar-width:thin; scrollbar-color:var(--line) var(--bg); }
  
  /* Navbar */
  header { position:sticky; top:0; z-index:20; background:var(--surface); backdrop-filter:blur(8px); border-bottom:1px solid var(--line); }
  .top { display:flex; align-items:center; gap:12px; padding:10px 16px; max-width:1200px; margin:0 auto; }
  .brand { display:flex; align-items:center; text-decoration:none; }
  .brand img { height:34px; width:auto; object-fit:contain; display:block; }

  .nav-toggle { background:none; border:none; color:var(--fg); cursor:pointer; padding:6px; display:flex; align-items:center; justify-content:center; border-radius:6px; }
  .nav-toggle:hover { background:rgba(255,255,255,0.05); }

  .header-acts { display:flex; align-items:center; gap:8px; margin-left:auto; }

  /* Menú Lateral */
  .sidebar-overlay { position:fixed; inset:0; background:rgba(0,0,0,0.6); backdrop-filter:blur(3px); z-index:40; opacity:0; pointer-events:none; transition:opacity 0.2s ease; }
  .sidebar-overlay.open { opacity:1; pointer-events:auto; }
  
  .sidebar { position:fixed; top:0; left:0; bottom:0; width:280px; background:var(--surface); border-right:1px solid var(--line); z-index:50; transform:translateX(-100%); transition:transform 0.25s cubic-bezier(0.4,0,0.2,1); display:flex; flex-direction:column; padding:20px; }
  .sidebar.open { transform:translateX(0); }
  .sidebar-header { display:flex; align-items:center; justify-content:space-between; margin-bottom:24px; }
  .sidebar-header h2 { margin:0; font-size:18px; }
  .sidebar-links { display:flex; flex-direction:column; gap:6px; }
  .sidebar-links button { background:none; border:none; text-align:left; color:var(--mut); font-size:15px; font-weight:600; padding:10px 12px; border-radius:6px; cursor:pointer; font-family:inherit; transition:all 0.15s; }
  .sidebar-links button:hover { background:rgba(255,255,255,0.04); color:var(--fg); }
  .sidebar-links button.on { color:var(--acc); background:rgba(47,212,198,0.08); }

  /* Búsqueda */
  .search-container { max-width:1200px; margin:0 auto; padding:0 16px; overflow:hidden; max-height:0; transition:max-height 0.25s ease, padding 0.25s ease; }
  .search-container.open { max-height:70px; padding:12px 16px 4px; }

  .btn { border:1px solid var(--line); background:var(--surface); color:var(--fg); padding:8px 14px; border-radius:6px; font-size:13.5px; font-weight:600; cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:6px; transition:background 0.15s, border-color 0.15s; }
  .btn:hover { border-color:var(--mut); background:rgba(255,255,255,0.03); }
  .btn.pri { background:var(--acc); border-color:var(--acc); color:var(--acc-fg); }
  .btn.pri:hover { opacity:0.9; }
  .btn.danger { color:var(--danger); border-color:rgba(240,104,107,0.3); }
  .btn.danger:hover { background:rgba(240,104,107,0.1); }
  .btn.sm { padding:5px 10px; font-size:12.5px; }
  .btn:disabled { opacity:.55; cursor:default; }
  .hide { display:none !important; }

  .av { border-radius:50%; object-fit:cover; display:grid; place-items:center; font-weight:700; color:var(--acc-fg); background:var(--acc); flex:none; overflow:hidden; }

  main { max-width:1200px; margin:0 auto; padding:20px 16px 50px; }
  input, textarea, select { width:100%; padding:10px 12px; border-radius:6px; border:1px solid var(--line); background:var(--surface); color:var(--fg); font-size:15px; font-family:inherit; }
  input:focus, textarea:focus, select:focus { outline:2px solid var(--acc); outline-offset:-1px; }

  /* Barra de Control (Filtros y Orden) */
  .control-bar { display:flex; align-items:center; justify-content:space-between; gap:12px; flex-wrap:wrap; margin-bottom:18px; border-bottom:1px solid var(--line); padding-bottom:12px; }
  .control-group { display:flex; align-items:center; gap:10px; flex-wrap:wrap; flex:1; }
  .select-wrapper { display:flex; align-items:center; gap:6px; width:auto; }
  .select-wrapper select { width:auto; padding:7px 12px; font-size:13.5px; font-weight:600; cursor:pointer; }
  .count { color:var(--mut); font-size:13px; margin-left:auto; white-space:nowrap; }

  /* Cuadrícula */
  .gb-grid { display:grid; grid-template-columns:repeat(2, 1fr); gap:12px; }
  @media (min-width: 680px) { .gb-grid { grid-template-columns:repeat(3, 1fr); gap:16px; } }
  @media (min-width: 1024px) { .gb-grid { grid-template-columns:repeat(4, 1fr); gap:18px; } }

  .gb-card { background:var(--surface); border:1px solid var(--line); border-radius:8px; overflow:hidden; cursor:pointer; display:flex; flex-direction:column; transition:transform 0.15s ease, border-color 0.15s ease, box-shadow 0.15s ease; }
  .gb-card:hover { border-color:var(--acc); transform:translateY(-3px); box-shadow:0 8px 20px rgba(0,0,0,0.3); }

  .gb-thumb { position:relative; width:100%; aspect-ratio:16/9; background:#000; overflow:hidden; display:grid; place-items:center; }
  .gb-thumb img.cover { width:100%; height:100%; object-fit:cover; display:block; transition:transform 0.2s ease; }
  .gb-card:hover .gb-thumb img.cover { transform:scale(1.03); }
  
  .badge-cat { position:absolute; bottom:8px; right:8px; background:rgba(0,0,0,0.85); backdrop-filter:blur(4px); color:var(--acc); border:1px solid var(--acc); font-size:10.5px; font-weight:700; padding:2px 6px; border-radius:4px; text-transform:uppercase; z-index:2; }
  .author-badge { position:absolute; top:8px; left:8px; display:flex; align-items:center; gap:5px; background:rgba(0,0,0,0.8); backdrop-filter:blur(4px); padding:3px 8px; border-radius:12px; border:1px solid rgba(255,255,255,0.12); font-size:11.5px; color:#fff; cursor:pointer; z-index:2; }
  .author-badge:hover { background:rgba(0,0,0,0.95); border-color:var(--acc); }

  .gb-info { padding:10px 12px; display:flex; flex-direction:column; gap:6px; flex:1; }
  .gb-title { margin:0; font-size:14.5px; font-weight:700; color:var(--yellow); line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; word-break:break-word; }
  .gb-card:hover .gb-title { text-decoration:underline; }

  .gb-stats { display:flex; align-items:center; gap:12px; color:var(--mut); font-size:12px; margin-top:auto; padding-top:4px; }
  .gb-stats span { display:inline-flex; align-items:center; gap:4px; }

  .empty { grid-column:1/-1; text-align:center; color:var(--mut); padding:48px 8px; font-size:15px; }

  /* Vista independiente del Mod */
  .mod-page { background:var(--surface); border:1px solid var(--line); border-radius:10px; padding:20px; margin-top:10px; }
  .mod-header-row { display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:12px; margin-bottom:16px; }

  .like-btn { background:none; border:1px solid var(--line); color:var(--fg); padding:8px 16px; border-radius:20px; font-size:14px; font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:8px; transition:all 0.15s ease; }
  .like-btn:hover { border-color:var(--danger); color:var(--danger); }
  .like-btn.liked { background:rgba(240,104,107,0.15); border-color:var(--danger); color:var(--danger); }

  .comments-sec { margin-top:30px; border-top:1px solid var(--line); padding-top:20px; }
  .comment-box { display:flex; gap:10px; margin-bottom:20px; }
  .comment-box input { flex:1; }
  .comment-item { background:var(--bg); border:1px solid var(--line); border-radius:8px; padding:12px 14px; margin-bottom:10px; font-size:14px; }
  .comment-head { display:flex; align-items:center; gap:8px; margin-bottom:6px; }
  .comment-user { font-weight:700; font-size:13px; }
  .comment-time { color:var(--mut); font-size:11.5px; margin-left:auto; }

  /* Modales sencillos para Formularios (Login, Subir, Ajustes) */
  dialog { 
    width: min(92vw, 600px); 
    max-height: 85vh; 
    border: 1px solid var(--line); 
    border-radius: 10px; 
    padding: 20px; 
    background: var(--surface); 
    color: var(--fg); 
    box-shadow: 0 16px 40px rgba(0,0,0,0.6); 
    overflow: hidden; 
  }
  dialog[open] { display: flex; flex-direction: column; }
  dialog::backdrop { background: rgba(0,0,0,.75); backdrop-filter: blur(4px); }
  dialog h2 { margin: 0 0 12px; font-size: 20px; flex-shrink: 0; }
  
  .row, #pgView, #pgEdit, #userBody, #mineList { overflow-y: auto; flex: 1; max-height: 55vh; padding-right: 4px; margin-bottom: 8px; }
  .row { display: flex; flex-direction: column; gap: 10px; }
  
  .acts { display: flex; gap: 10px; margin-top: 14px; flex-shrink: 0; flex-wrap: wrap; }
  .acts .btn { flex: 1; }

  .filebtn { display:block; padding:14px; text-align:center; border:1px dashed var(--mut); border-radius:6px; color:var(--mut); cursor:pointer; font-size:13.5px; transition:border-color 0.15s, color 0.15s; }
  .filebtn:hover { border-color:var(--acc); color:var(--fg); }
  .filebtn input { display:none; }
  .hint { color:var(--mut); font-size:12.5px; margin:2px 0; }
  .thumbs { display:flex; gap:8px; flex-wrap:wrap; }
  .thumbs img { width:70px; height:70px; object-fit:cover; border-radius:6px; border:1px solid var(--line); }
  .thumb { position:relative; }
  .thumb button { position:absolute; top:-6px; right:-6px; width:20px; height:20px; border-radius:50%; border:none; background:var(--danger); color:#fff; font-size:11px; cursor:pointer; padding:0; }
  
  .gallery { display:flex; gap:10px; overflow-x:auto; scroll-snap-type:x mandatory; margin-bottom:16px; border-radius:8px; background:var(--bg); border:1px solid var(--line); padding:8px; width:100%; }
  .gallery img { width:100%; max-height:420px; aspect-ratio:16/9; border-radius:6px; scroll-snap-align:start; flex:none; object-fit:contain; }

  .desc { white-space:pre-wrap; word-break:break-word; margin:14px 0 20px; font-size:15px; line-height:1.6; }
  .mine { border:1px solid var(--line); border-radius:6px; padding:12px; margin-bottom:10px; background:rgba(255,255,255,0.01); }
  .chip { display:inline-block; font-size:11px; font-weight:700; padding:2px 7px; border-radius:4px; border:1px solid var(--line); margin-bottom:6px; }
  .chip.ok { color:var(--acc); border-color:var(--acc); }
  .chip.off { color:var(--mut); }
  .uhead { display:flex; align-items:center; gap:14px; margin-bottom:10px; }
  .rich p { margin:0 0 10px; }
  .rich ul { margin:0 0 10px; padding-left:20px; }
  #toast { position:fixed; left:50%; bottom:24px; transform:translateX(-50%); z-index:50; max-width:90vw; padding:12px 18px; border-radius:8px; font-weight:600; font-size:14px; display:none; background:var(--fg); color:var(--bg); box-shadow:0 6px 24px rgba(0,0,0,.5); }
</style>
</head>
<body>

<svg width="0" height="0" style="position:absolute" aria-hidden="true"><defs>
  <symbol id="i-dl" viewBox="0 0 16 16"><path d="M8 2v8m0 0L5 7m3 3l3-3M3 13h10" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></symbol>
  <symbol id="i-eye" viewBox="0 0 16 16"><path d="M1.5 8S4 3.5 8 3.5 14.5 8 14.5 8 12 12.5 8 12.5 1.5 8 1.5 8z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="8" cy="8" r="2" fill="none" stroke="currentColor" stroke-width="1.5"/></symbol>
  <symbol id="i-heart" viewBox="0 0 16 16"><path d="M8 14s-5.5-3.5-7-6.5C-.2 4.5 1.5 1.5 4.5 2 6.2 2.3 7.3 3.5 8 4.2c.7-.7 1.8-1.9 3.5-2.2 3-.5 4.7 2.5 3.5 5.5-1.5 3-7 6.5-7 6.5z" fill="currentColor"/></symbol>
  <symbol id="i-menu" viewBox="0 0 24 24"><path d="M3 12h18M3 6h18M3 18h18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-search" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8" fill="none" stroke="currentColor" stroke-width="2"/><path d="M21 21l-4.35-4.35" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></symbol>
  <symbol id="i-back" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</defs></svg>

<!-- Menú Lateral -->
<div id="sidebarOverlay" class="sidebar-overlay"></div>
<aside id="sidebar" class="sidebar">
  <div class="sidebar-header">
    <h2 data-i18n="nav_title">Navegación</h2>
    <button class="btn sm" id="btnCloseSidebar">✕</button>
  </div>
  <div class="sidebar-links">
    <button class="on" data-nav="mods" data-i18n="nav_mods">Mods</button>
    <button data-nav="rules" data-i18n="nav_rules">Reglas</button>
    <button data-nav="info" data-i18n="nav_info">Información</button>
    <button data-nav="settings" data-i18n="nav_settings">Ajustes</button>
  </div>
</aside>

<header>
  <div class="top">
    <button id="btnOpenSidebar" class="nav-toggle" aria-label="Abrir menú">
      <svg class="ic"><use href="#i-menu"/></svg>
    </button>
    <a class="brand" href="./">
      <img src="logo.png" alt="Project Diva Logo">
    </a>

    <div class="header-acts">
      <button id="btnToggleSearch" class="btn sm" aria-label="Buscar" style="padding:6px 10px">
        <svg class="ic"><use href="#i-search"/></svg>
      </button>
      <button id="btnProfile" class="btn hide" style="padding:4px 10px;display:flex;align-items:center;gap:6px">
        <span id="hAv"></span><span id="hName" style="max-width:100px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"></span>
      </button>
      <button id="btnOpenUpload" class="btn pri hide" data-i18n="btn_upload">Subir</button>
      <button id="btnOpenAuth" class="btn pri" data-i18n="btn_auth">Entrar</button>
    </div>
  </div>
  <div id="searchContainer" class="search-container">
    <input id="q" type="search" data-i18n-ph="search_ph" placeholder="Buscar mods por título, autor o descripción...">
  </div>
</header>
  
<main>
  <!-- Sección Principal: Lista de Mods -->
  <div id="mainView">
    <div class="control-bar">
      <div class="control-group">
        <div class="select-wrapper">
          <select id="catSelect">
            <option value="all" data-i18n="cat_all">Todas las categorías</option>
            <option value="songs" data-i18n="cat_songs">Canciones</option>
            <option value="modules" data-i18n="cat_modules">Módulos</option>
            <option value="ui" data-i18n="cat_ui">UI / Interfaz</option>
            <option value="patches" data-i18n="cat_patches">Parches / Scripts</option>
            <option value="edits_pv" data-i18n="cat_edits_pv">EDITS PV</option>
            <option value="3dpv" data-i18n="cat_3dpv">3DPV</option>
            <option value="other" data-i18n="cat_other">Otros</option>
          </select>
        </div>

        <div class="select-wrapper">
          <select id="sortSelect">
            <option value="created_at_desc" data-i18n="sort_recent_desc">Más recientes primero</option>
            <option value="created_at_asc" data-i18n="sort_recent_asc">Más antiguos primero</option>
            <option value="downloads_desc" data-i18n="sort_downloads_desc">Más descargados</option>
            <option value="views_desc" data-i18n="sort_views_desc">Más vistos</option>
          </select>
        </div>
      </div>
      
      <span id="count" class="count"></span>
    </div>

    <div id="list" class="gb-grid"><div class="empty" data-i18n="loading">Cargando...</div></div>
  </div>

  <!-- Sección Independiente: Detalles del Mod -->
  <div id="modPageContainer" class="hide">
    <button id="btnBackToList" class="btn sm" style="margin-bottom:14px">
      <svg class="ic"><use href="#i-back"/></svg> Volver a la lista
    </button>
    <div id="modPageContent" class="mod-page"></div>
  </div>
</main>

<dialog id="authDlg">
  <h2 data-i18n="auth_title">Cuenta</h2>
  <div class="row">
    <input id="email" type="email" data-i18n-ph="ph_email" placeholder="Correo electrónico" autocomplete="email">
    <input id="password" type="password" data-i18n-ph="ph_pass" placeholder="Contraseña (mín. 6 caracteres)" autocomplete="current-password">
  </div>
  <div class="acts"><button id="btnLogin" class="btn pri" data-i18n="btn_login">Iniciar sesión</button><button id="btnSignup" class="btn" data-i18n="btn_signup">Crear cuenta</button></div>
  <div class="acts"><button class="btn" data-close data-i18n="btn_close">Cerrar</button></div>
</dialog>

<dialog id="pageDlg">
  <div id="pgView">
    <h2 id="pgTitle"></h2>
    <div id="pgBody" class="rich"></div>
  </div>
  <div id="pgEdit" class="hide">
    <h2 data-i18n="edit_page_title">Editar página</h2>
    <div class="row">
      <input id="pgTitleIn" maxlength="80" data-i18n-ph="ph_title" placeholder="Título">
      <textarea id="pgBodyIn" rows="8" data-i18n-ph="ph_text" placeholder="Texto"></textarea>
    </div>
  </div>
  <div class="acts" id="pgActsView"><button id="btnPgEdit" class="btn hide" data-i18n="btn_edit">Editar</button><button class="btn" data-close data-i18n="btn_close">Cerrar</button></div>
  <div class="acts hide" id="pgActsEdit"><button id="btnPgSave" class="btn pri" data-i18n="btn_save">Guardar</button><button id="btnPgCancel" class="btn" data-i18n="btn_cancel">Cancelar</button></div>
</dialog>

<dialog id="settingsDlg">
  <h2 data-i18n="settings_title">Ajustes</h2>
  <div class="row">
    <label style="display:flex;flex-direction:column;gap:6px">
      <span data-i18n="settings_theme" style="font-weight:600">Tema</span>
      <select id="themeSelect">
        <option value="dark" data-i18n="theme_dark">Oscuro</option>
        <option value="light" data-i18n="theme_light">Claro</option>
      </select>
    </label>
    <label style="display:flex;flex-direction:column;gap:6px">
      <span data-i18n="settings_lang" style="font-weight:600">Idioma / Language</span>
      <select id="langSelect">
        <option value="es">Español</option>
        <option value="en">English</option>
      </select>
    </label>
  </div>
  <div class="acts"><button class="btn pri" data-close data-i18n="btn_close">Cerrar</button></div>
</dialog>

<dialog id="userDlg">
  <div id="userBody"></div>
  <div class="acts"><button class="btn" data-close data-i18n="btn_close">Cerrar</button></div>
</dialog>

<dialog id="profDlg">
  <h2 data-i18n="edit_profile">Editar perfil</h2>
  <div class="row">
    <div style="display:flex;align-items:center;gap:12px"><span id="pAv"></span>
      <label class="btn" style="cursor:pointer"><span data-i18n="change_photo">Cambiar foto</span><input id="pFile" type="file" accept="image/*" class="hide"></label></div>
    <input id="pName" data-i18n-ph="ph_username" placeholder="Nombre de usuario" maxlength="30">
    <textarea id="pBio" rows="4" maxlength="500" data-i18n-ph="ph_bio" placeholder="Cuéntanos sobre ti"></textarea>
  </div>
  <div class="acts"><button id="btnSaveProf" class="btn pri" data-i18n="btn_save">Guardar</button><button class="btn" data-close data-i18n="btn_cancel">Cancelar</button></div>
</dialog>

<dialog id="mineDlg">
  <h2 data-i18n="my_mods">Mis mods</h2>
  <div id="mineList"></div>
  <div class="acts"><button class="btn" data-close data-i18n="btn_close">Cerrar</button></div>
</dialog>

<dialog id="upDlg">
  <h2 data-i18n="upload_title">Subir un mod</h2>
  <div class="row">
    <input id="title" data-i18n-ph="ph_mod_title" placeholder="Título del mod" maxlength="80">
    <select id="category">
      <option value="songs" data-i18n="cat_songs">Canciones</option>
      <option value="modules" data-i18n="cat_modules">Módulos</option>
      <option value="ui" data-i18n="cat_ui">UI / Interfaz</option>
      <option value="patches" data-i18n="cat_patches">Parches / Scripts</option>
      <option value="edits_pv" data-i18n="cat_edits_pv">EDITS PV</option>
      <option value="3dpv" data-i18n="cat_3dpv">3DPV</option>
      <option value="other" selected data-i18n="cat_other">Otros</option>
    </select>
    <textarea id="desc" rows="4" data-i18n-ph="ph_mod_desc" placeholder="Descripción"></textarea>
    <label class="filebtn"><span id="imgName" data-i18n="img_placeholder">Imágenes del mod (hasta 5)</span><input id="imgs" type="file" accept="image/*" multiple></label>

  rpc("increment_views", id); m.views = (m.views || 0) + 1; renderMods();

  const link = safeUrl(m.file_url) || safeUrl(m.external_url);
  const imgs = (m.images || []).filter(safeUrl);
  const owner = isOwner(m);
  const tLang = i18n[currentLang];
  let acts = "";
  if (owner) acts = `<div class="acts" style="margin-top:12px"><button class="btn sm" data-act="edit" data-id="${esc(m.id)}">${tLang.edit}</button><button class="btn sm" data-act="hide" data-id="${esc(m.id)}">${tLang.hide}</button><button class="btn sm danger" data-act="del" data-id="${esc(m.id)}">${tLang.delete}</button></div>`;

  $("modPageContent").innerHTML = `
    ${imgs.length ? `<div class="gallery">${imgs.map((u) => `<img src="${esc(u)}" alt="">`).join("")}</div>` : ""}
    <div class="mod-header-row">
      <div>
        <h1 style="margin:0 0 6px;color:var(--yellow);font-size:24px">${esc(m.title)}</h1>
        <div class="who" data-user="${esc(m.user_id)}" style="font-size:15px;display:flex;align-items:center;gap:8px;cursor:pointer">${avatarHtml(m.profiles && m.profiles.avatar_url, authorOf(m), 26)}<span>${esc(authorOf(m))}</span></div>
      </div>
      <button id="btnLike" class="like-btn">${ic("i-heart")} <span>0 Likes</span></button>
    </div>

    <div class="gb-stats" style="margin-bottom:16px;font-size:13.5px">
      <span>${ic("i-dl")}<b id="dlCount">${m.downloads || 0}</b> descargas</span>
      <span>${ic("i-eye")}${m.views} vistas</span>
      <span>${fmtDate(m.created_at)}</span>
    </div>

    <p class="desc">${esc(m.description)}</p>

    ${link ? `<a id="dlBtn" class="btn pri" style="display:inline-flex;padding:12px 24px;font-size:16px;width:100%;max-width:300px" href="${esc(link)}" target="_blank" rel="noopener">${tLang.download_btn}</a>` : ""}
    ${acts}

    <div class="comments-sec">
      <h3 style="font-size:17px;margin:0 0 12px">Comentarios</h3>
      <div class="comment-box">
        <input id="cInput" placeholder="Escribe un comentario o sugerencia constructiva..." maxlength="250">
        <button id="btnPostC" class="btn pri sm">Enviar</button>
      </div>
      <div id="commentsList">Cargando comentarios...</div>
    </div>`;

  $("mainView").classList.add("hide");
  $("modPageContainer").classList.remove("hide");
  window.scrollTo({ top: 0, behavior: "smooth" });

  const b = $("dlBtn");
  if (b) b.onclick = () => { rpc("increment_downloads", id); m.downloads = (m.downloads || 0) + 1; $("dlCount").textContent = m.downloads; renderMods(); };
  $("btnPostC").onclick = () => postComment(id);

  loadModSocialData(id);
}

function closeModPage() {
  window.location.hash = "";
  $("modPageContainer").classList.add("hide");
  $("mainView").classList.remove("hide");
}

$("btnBackToList").onclick = closeModPage;

function checkUrlHash() {
  const hash = window.location.hash;
  if (hash.startsWith("#mod=")) {
    const id = hash.replace("#mod=", "");
    if (id) openModPage(id);
  } else {
    closeModPage();
  }
}
window.onhashchange = checkUrlHash;

$("list").onclick = (e) => {
  const u = e.target.closest("[data-user]"); if (u) { openUser(u.dataset.user); return; }
  const c = e.target.closest(".gb-card"); if (c) openModPage(c.dataset.id);
};

$("modPageContent").onclick = (e) => {
  const u = e.target.closest("[data-user]"); if (u) { openUser(u.dataset.user); return; }
  onAction(e);
};

async function openUser(uid) {
  if (!isUuid(uid)) return;
  const tLang = i18n[currentLang];
  $("userBody").innerHTML = `<p class='hint'>${tLang.loading}</p>`;
  if (!$("userDlg").open) $("userDlg").showModal();
  try {
    const [pr, mr] = await Promise.all([
      fetch(URL_BASE + "/rest/v1/profiles?select=*&id=eq." + uid, { headers: headers() }).then((r) => r.json()).catch(() => []),
      fetch(URL_BASE + "/rest/v1/mods?select=*,profiles(username,avatar_url)&user_id=eq." + uid + "&approved=eq.true&hidden=eq.false&order=created_at.desc", { headers: headers() }).then((r) => r.json()).catch(() => []),
    ]);
    const p = Array.isArray(pr) ? pr[0] : null;
    if (!p) { $("userBody").innerHTML = `<p class='hint'>Perfil no encontrado.</p>`; return; }
    userMods = Array.isArray(mr) ? mr : [];
    const own = myId() === uid;
    const totalDl = userMods.reduce((s, m) => s + (m.downloads || 0), 0);
    $("userBody").innerHTML = `
      <div class="uhead">${avatarHtml(p.avatar_url, p.username, 56)}
        <div><h2 style="margin:0">${esc(p.username)}</h2>
          <div class="hint">${tLang.member_since} ${esc(new Date(p.created_at).toLocaleDateString(currentLang === 'es' ? "es" : "en", { month: "long", year: "numeric" }))}</div>
          ${own && isMod ? `<span class="chip ok" style="margin:4px 0 0">${tLang.moderator}</span>` : ""}</div></div>
      <p class="desc" style="margin-top:12px">${p.bio ? esc(p.bio) : (own ? tLang.no_bio_own : tLang.no_bio)}</p>
      <div class="gb-stats" style="margin-bottom:12px"><span><b>${userMods.length}</b> mods</span><span>${ic("i-dl")}<b>${totalDl}</b> ${tLang.downloads_word}</span></div>
      ${own ? `<div class="acts"><button class="btn sm" data-uact="edit">${tLang.edit_profile}</button><button class="btn sm" data-uact="mine">${tLang.my_mods}</button><button class="btn sm danger" data-uact="logout">${tLang.logout}</button></div>` : ""}
      <h3 style="margin:16px 0 8px;font-size:15px">Mods de ${esc(p.username)}</h3>
      <div class="gb-grid">${userMods.length ? userMods.map(gbItemHtml).join("") : `<div class='empty'>Sin mods.</div>`}</div>`;
  } catch (e) { $("userBody").innerHTML = "<p class='hint'>Error.</p>"; }
}

$("userBody").onclick = (e) => {
  const a = e.target.closest("[data-uact]");
  if (a) {
    if (a.dataset.uact === "edit") {
      $("userDlg").close();
      $("pName").value = (profile && profile.username) || ""; $("pBio").value = (profile && profile.bio) || "";
      $("pAv").innerHTML = avatarHtml(profile && profile.avatar_url, profile && profile.username, 56); $("pFile").value = "";
      $("profDlg").showModal();
    } else if (a.dataset.uact === "mine") { $("userDlg").close(); openMine(); }
    else if (a.dataset.uact === "logout") { saveSession(null); $("userDlg").close(); toast("Sesión cerrada."); loadMods(); }
    return;
  }
  const u = e.target.closest("[data-user]"); if (u && u.dataset.user === myId()) return;
  const c = e.target.closest(".gb-card"); if (c) { $("userDlg").close(); openModPage(c.dataset.id); }
};

function renderMine() {
  if (!mine.length) { $("mineList").innerHTML = "<p class='hint'>Todavía no has subido mods.</p>"; return; }
  const tLang = i18n[currentLang];
  $("mineList").innerHTML = mine.map((m) => {
    const st = m.hidden ? ["off", tLang.hidden] : ["ok", tLang.published];
    return `<div class="mine"><span class="chip ${st[0]}">${st[1]}</span><h3>${esc(m.title)}</h3>
      <div class="gb-stats"><span>⬇ ${m.downloads || 0}</span><span>👁 ${m.views || 0}</span></div>
      <div class="acts"><button class="btn sm" data-act="edit" data-id="${esc(m.id)}">${tLang.edit}</button>
      <button class="btn sm" data-act="hide" data-id="${esc(m.id)}">${m.hidden ? tLang.show : tLang.hide}</button>
      <button class="btn sm danger" data-act="del" data-id="${esc(m.id)}">${tLang.delete}</button></div></div>`;
  }).join("");
}

async function openMine() { await refreshIfNeeded(); await loadMine(); renderMine(); if (!$("mineDlg").open) $("mineDlg").showModal(); }

async function toggleHide(m) {
  try {
    await patchMod(m.id, { hidden: !m.hidden });
    toast("OK");
    await Promise.all([loadMods(), loadMine()]); renderMine(); closeModPage();
  } catch (e) { toast("Error: " + e.message); }
}

async function deleteMod(m) {
  if (!confirm("¿Eliminar?")) return;
  try {
    const r = await fetch(URL_BASE + "/rest/v1/mods?id=eq." + m.id, { method: "DELETE", headers: headers({ Prefer: "return=minimal" }) });
    if (!r.ok) { const e = await r.json().catch(() => ({})); throw new Error(e.message || ("Error " + r.status)); }
    await removeFiles("mods", [m.file_url]); await removeFiles("images", m.images || []);
    toast("Eliminado.");
    await Promise.all([loadMods(), loadMine()]); renderMine(); closeModPage();
  } catch (e) { toast("Error: " + e.message); }
}

function renderEditThumbs() {
  $("eThumbs").innerHTML = editImgs.map((u, i) => `<span class="thumb"><img src="${esc(u)}" alt=""><button data-rm="${i}" type="button">✕</button></span>`).join("");
}

function openEdit(m) {
  editing = m; editImgs = (m.images || []).slice();
  $("eTitle").value = m.title || ""; 
  $("eCategory").value = m.category || "other";
  $("eDesc").value = m.description || ""; 
  $("eExt").value = m.external_url || "";
  $("eImgs").value = ""; 
  $("eFile").value = "";
  renderEditThumbs();
  
  if ($("mineDlg").open) $("mineDlg").close();
  if ($("upDlg").open) $("upDlg").close();
  
  $("editDlg").showModal();
}

$("eThumbs").onclick = (e) => { const b = e.target.closest("[data-rm]"); if (b) { editImgs.splice(+b.dataset.rm, 1); renderEditThumbs(); } };
$("eImgs").onchange = () => {};
$("eFile").onchange = () => {};

$("btnSaveEdit").onclick = async () => {
  const m = editing; if (!m) return;
  const title = $("eTitle").value.trim(), category = $("eCategory").value, description = $("eDesc").value.trim(), ext = $("eExt").value.trim();
  const newImgs = Array.from($("eImgs").files), newFile = $("eFile").files[0];
  
  if (!title) return toast("Título requerido.");
  await refreshIfNeeded(); if (!session) return toast("Inicia sesión.");

  const btn = $("btnSaveEdit"); btn.disabled = true;
  try {
    const uid = session.user.id, stamp = Date.now();
    const images = editImgs.slice();
    for (let i = 0; i < newImgs.length; i++) {
      images.push(await uploadFile("images", uid + "/" + stamp + "_" + i + "_" + safeName(newImgs[i].name), newImgs[i]));
    }
    let fileUrl = m.file_url;
    if (newFile) {
      fileUrl = await uploadFile("mods", uid + "/" + stamp + "_" + safeName(newFile.name), newFile);
    }
    
    await patchMod(m.id, { title, category, description, images, file_url: fileUrl, external_url: ext || null });
    $("editDlg").close(); 
    toast("Guardado.");
    await Promise.all([loadMods(), loadMine()]); 
    if ($("mineDlg").open) renderMine();
    openModPage(m.id);
  } catch (e) { toast("Error: " + e.message); } finally { btn.disabled = false; }
};

function onAction(e) {
  const b = e.target.closest("[data-act]"); if (!b) return;
  const m = findMod(b.dataset.id); if (!m) return;
  if (b.dataset.act === "edit" && isOwner(m)) openEdit(m);
  else if (b.dataset.act === "hide") toggleHide(m);
  else if (b.dataset.act === "del") deleteMod(m);
}
$("mineList").onclick = onAction;

function showPage(key) {
  curPage = key;
  const p = pages[key] || DEFAULT_PAGES[key];
  $("pgTitle").textContent = p.title; $("pgBody").innerHTML = richText(p.body);
  $("pgView").classList.remove("hide"); $("pgActsView").classList.remove("hide");
  $("pgEdit").classList.add("hide"); $("pgActsEdit").classList.add("hide");
  $("btnPgEdit").classList.toggle("hide", !isMod);
}

function openPage(key) { 
  showPage(key); 
  if (!$("pageDlg").open) $("pageDlg").showModal(); 
}

$("btnPgEdit").onclick = () => {
  const p = pages[curPage] || DEFAULT_PAGES[curPage];
  $("pgTitleIn").value = p.title; $("pgBodyIn").value = p.body;
  $("pgView").classList.add("hide"); $("pgActsView").classList.add("hide");
  $("pgEdit").classList.remove("hide"); $("pgActsEdit").classList.remove("hide");
};

$("btnPgCancel").onclick = () => showPage(curPage);

$("btnPgSave").onclick = async () => {
  const title = $("pgTitleIn").value.trim(), body = $("pgBodyIn").value.trim();
  if (!title) return;
  await refreshIfNeeded(); if (!session) return;
  try {
    const r = await fetch(URL_BASE + "/rest/v1/site_pages?key=eq." + curPage, { method: "PATCH", headers: headers({ "Content-Type": "application/json", Prefer: "return=representation" }), body: JSON.stringify({ title, body, updated_at: new Date().toISOString() }) });
    const d = await r.json().catch(() => []);
    if (!r.ok) throw new Error();
    pages[curPage] = { title, body }; showPage(curPage); toast("Actualizado.");
  } catch (e) { toast("Error"); }
};

/* Sidebar y Ajustes */
const toggleSidebar = (open) => {
  $("sidebar").classList.toggle("open", open);
  $("sidebarOverlay").classList.toggle("open", open);
};

$("btnOpenSidebar").onclick = () => toggleSidebar(true);
$("btnCloseSidebar").onclick = () => toggleSidebar(false);
$("sidebarOverlay").onclick = () => toggleSidebar(false);

document.querySelectorAll(".sidebar-links button").forEach((b) => {
  b.onclick = () => {
    document.querySelectorAll(".sidebar-links button").forEach((x) => x.classList.toggle("on", x === b));
    toggleSidebar(false);
    const nav = b.dataset.nav;
    if (nav === "mods") {
      closeModPage();
      window.scrollTo({ top: 0, behavior: "smooth" });
    } else if (nav === "settings") {
      if (!$("settingsDlg").open) $("settingsDlg").showModal();
    } else {
      openPage(nav);
    }
  };
});

$("btnToggleSearch").onclick = () => {
  const sc = $("searchContainer");
  sc.classList.toggle("open");
  if (sc.classList.contains("open")) $("q").focus();
};

$("themeSelect").onchange = (e) => setTheme(e.target.value);
$("langSelect").onchange = (e) => {
  setLanguage(e.target.value);
  renderMods();
};

// Cierre automático de modales al hacer clic fuera (en el backdrop)
document.querySelectorAll("dialog").forEach((dlg) => {
  dlg.addEventListener("click", (e) => {
    if (e.target === dlg) {
      dlg.close();
    }
  });
});

document.querySelectorAll("[data-close]").forEach((b) => (b.onclick = () => b.closest("dialog").close()));
$("btnOpenAuth").onclick = () => $("authDlg").showModal();
$("btnOpenUpload").onclick = () => $("upDlg").showModal();
$("btnProfile").onclick = () => openUser(myId());
$("q").oninput = renderMods;

$("btnLogin").onclick = async () => {
  const email = $("email").value.trim(), password = $("password").value;
  if (!email || !password) return;
  try { saveSession(await authCall("token?grant_type=password", { email, password })); await loadProfile(); $("authDlg").close(); loadMods(); }
  catch (e) { toast("Error: " + e.message); }
};

$("btnSignup").onclick = async () => {
  const email = $("email").value.trim(), password = $("password").value;
  if (!email || password.length < 6) return;
  try {
    const d = await authCall("signup", { email, password }); $("authDlg").close();
    if (d.access_token) { saveSession(d); await loadProfile(); }
  } catch (e) { toast("Error: " + e.message); }
};

$("pFile").onchange = () => { const f = $("pFile").files[0]; if (f) $("pAv").innerHTML = `<img class="av" src="${URL.createObjectURL(f)}" width="56" height="56" alt="">`; };

$("btnSaveProf").onclick = async () => {
  await refreshIfNeeded(); if (!session) return;
  const name = $("pName").value.trim(), bio = $("pBio").value.trim();
  if (!name) return;
  const f = $("pFile").files[0];
  try {
    let avatar = profile && profile.avatar_url;
    if (f) avatar = await uploadFile("images", session.user.id + "/avatar_" + Date.now() + "_" + safeName(f.name), f);
    await fetch(URL_BASE + "/rest/v1/profiles?id=eq." + session.user.id, { method: "PATCH", headers: headers({ "Content-Type": "application/json", Prefer: "return=minimal" }), body: JSON.stringify({ username: name, avatar_url: avatar, bio: bio || null }) });
    profile = Object.assign(profile || {}, { username: name, avatar_url: avatar, bio: bio || null }); renderAuth(); loadMods();
    $("profDlg").close(); openUser(session.user.id);
  } catch (e) { toast("Error"); }
};

$("btnUpload").onclick = async () => {
  const title = $("title").value.trim(), category = $("category").value, description = $("desc").value.trim();
  const file = $("file").files[0], ext = $("ext").value.trim();
  const imgs = Array.from($("imgs").files).slice(0, 5);
  if (!title) return toast("Escribe un título.");
  await refreshIfNeeded(); if (!session) return toast("Inicia sesión primero.");
  if (!profile) await loadProfile();

  const btn = $("btnUpload"); btn.disabled = true; btn.textContent = "Subiendo...";
  try {
    const uid = session.user.id, stamp = Date.now();
    const imageUrls = [];
    for (let i = 0; i < imgs.length; i++) imageUrls.push(await uploadFile("images", uid + "/" + stamp + "_" + i + "_" + safeName(imgs[i].name), imgs[i]));
    const fileUrl = file ? await uploadFile("mods", uid + "/" + stamp + "_" + safeName(file.name), file) : null;
    
    const ins = await fetch(URL_BASE + "/rest/v1/mods", { method: "POST", headers: headers({ "Content-Type": "application/json", Prefer: "return=minimal" }),
      body: JSON.stringify({ title, category, description, author: (profile && profile.username) || "Anónimo", file_url: fileUrl, external_url: ext || null, images: imageUrls, approved: true, user_id: session.user.id }) });
    
    if (!ins.ok) { const e = await ins.json().catch(() => ({})); throw new Error(e.message || ("Error al guardar (" + ins.status + ")")); }

    $("upDlg").close();
    toast("¡Mod publicado!");
    ["title", "desc", "ext"].forEach((id) => ($(id).value = "")); $("file").value = ""; $("imgs").value = "";
    loadMods();
  } catch (e) { 
    toast("Error: " + e.message); 
  } finally { 
    btn.disabled = false; 
    btn.textContent = currentLang === 'es' ? "Subir mod" : "Upload mod"; 
  }
};

// Inicialización
setTheme(currentTheme);
setLanguage(currentLang);

renderAuth();
refreshIfNeeded().then(loadProfile);
loadPages();
loadMods();
</script>
</body>
</html>
