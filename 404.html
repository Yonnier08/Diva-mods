<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <title>Redirigiendo...</title>
  <script>
    // Script para redirigir las peticiones de GitHub Pages a index.html manteniendo los tokens de Supabase
    (function() {
      const segment = window.location.pathname.split('/')[1];
      const basePath = segment ? `/${segment}/` : '/';
      window.location.replace(basePath + window.location.search + window.location.hash);
    })();
  </script>
</head>
<body>
</body>
</html>
